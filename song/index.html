<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>歌詞簿</title>
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div class="app-container" id="app">
    <div class="view active" id="viewCatalog">
      <nav class="nav-bar">
        <button class="nav-back" id="catalogBack" aria-label="返回">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></svg>
        </button>
        <span class="nav-title">目錄</span>
      </nav>

      <div class="search-bar">
        <div class="search-container">
          <span class="search-icon">
            <svg viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="8" />
              <path d="M21 21l-4.35-4.35" />
            </svg>
          </span>
          <input class="search-input" id="catalogSearch" type="text" placeholder="搜尋全部歌單..." autocomplete="off" />
          <button class="search-clear" id="searchClear" aria-label="清除搜尋">
            <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" /></svg>
          </button>
        </div>
      </div>

      <main class="list-scroll" id="catalogListScroll">
        <div id="catalogListContainer"></div>
      </main>

      <footer class="bottom-nav">
        <button class="nav-item active" data-tab="catalog" aria-label="目錄">
          <svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" /></svg>
          <span class="nav-label">目錄</span>
        </button>
        <button class="nav-item" data-tab="bookmark" aria-label="書籤">
          <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" /></svg>
          <span class="nav-label">書籤</span>
        </button>
        <button class="nav-item" data-tab="lyrics" aria-label="自定歌詞">
          <svg class="nav-icon" viewBox="0 0 24 24">
            <path d="M12 2L2 7l10 5 10-5-10-5z" />
            <path d="M2 17l10 5 10-5" />
            <path d="M2 12l10 5 10-5" />
          </svg>
          <span class="nav-label">自定歌詞</span>
        </button>
        <button class="nav-item" data-tab="settings" aria-label="設定">
          <svg class="nav-icon" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3" />
            <path d="M12 1v3M12 20v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M1 12h3M20 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12" />
          </svg>
          <span class="nav-label">設定</span>
        </button>
      </footer>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
