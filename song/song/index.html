                rowHtml += `<button class="hl-eraser-btn${this.eraserMode ? ' active' : ''}" id="hlEraserBtn" title="橡皮擦">🧹</button>`;
                rowHtml += `<button class="hl-mark-btn${this.hasTextSelection && !this.eraserMode ? ' visible' : ''}" id="hlMarkBtn">標記</button>`;
                row.innerHTML = rowHtml;

                /* 顏色圖例 */
                let legendHtml = '';
                HIGHLIGHT_COLORS.forEach((c, i) => {
                    legendHtml += `<div class="hl-legend-item" data-hl-meaning="${i}">`;
                    legendHtml += `<span class="hl-legend-dot" style="background:${c.dot};"></span>`;
                    legendHtml += `<span class="hl-legend-text">${this.escapeHtml(this.colorMeanings[i])}</span>`;
                    legendHtml += '</div>';
                });
                legend.innerHTML = legendHtml;

                /* 綁定事件 */
                row.querySelectorAll('[data-hl-color]').forEach(btn => {
                    btn.addEventListener('click', () => { app.handleHlColorClick(parseInt(btn.dataset.hlColor)); });
                });
                const eraserBtn = document.getElementById('hlEraserBtn');
                if (eraserBtn) eraserBtn.addEventListener('click', () => { app.toggleEraserMode(); });
                const markBtn = document.getElementById('hlMarkBtn');
                if (markBtn) markBtn.addEventListener('click', () => { app.handleHlMark(); });
                legend.querySelectorAll('[data-hl-meaning]').forEach(item => {
                    item.addEventListener('click', () => { app.showColorMeaningModal(parseInt(item.dataset.hlMeaning)); });
                });
            }

            /* ============================================================
               顏色含義編輯 Modal
               ============================================================ */
            showColorMeaningModal(colorIndex) {
                const color = HIGHLIGHT_COLORS[colorIndex];
                const currentMeaning = this.colorMeanings[colorIndex] || '';
                const bodyHtml = `
                    <div class="form-group">
                        <label class="form-label">
                            <span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${color.dot};vertical-align:middle;margin-right:6px;"></span>
                            ${this.escapeHtml(color.name)}的含義
                        </label>
                        <input class="form-input" id="colorMeaningInput" type="text" placeholder="輸入此顏色代表的含義" value="${this.escapeHtml(currentMeaning)}" maxlength="20" />
                    </div>`;
                const footerHtml = `<button class="modal-btn cancel" id="modalCancelBtn">取消</button><button class="modal-btn confirm" id="modalConfirmBtn">確認</button>`;
                this.showModal('編輯顏色含義', bodyHtml, footerHtml);
                document.getElementById('modalCancelBtn').addEventListener('click', () => app.hideModal());
                document.getElementById('modalConfirmBtn').addEventListener('click', () => {
                    const meaning = document.getElementById('colorMeaningInput').value.trim();
                    app.colorMeanings[colorIndex] = meaning || DEFAULT_COLOR_MEANINGS[colorIndex];
                    app.saveColorMeanings();
                    app.hideModal();
                    app.renderHighlightToolbar();
                    app.showToast('含義已更新', 'success');
                });
                setTimeout(() => { const input = document.getElementById('colorMeaningInput'); if (input) input.focus(); }, 300);
            }

            getCatLabel(catKey) {
                const cat = this.categories.find(c => c.key === catKey);
                return cat ? cat.label : catKey;
            }

            /* ============================================================
               書籤操作
               ============================================================ */
            toggleBookmark(id) {
                const idx = this.bookmarks.indexOf(id);
                if (idx >= 0) {
                    this.bookmarks.splice(idx, 1);
                    this.showToast('已移除書籤', 'info');
                } else {
                    this.bookmarks.push(id);
                    this.showToast('已加入書籤', 'success');
                }
                this.saveBookmarks();
            }

            /* ============================================================
               渲染：自訂頁
               ============================================================ */
            renderCustom() {
                const container = document.getElementById('customContent');
                if (!container) return;
                let html = '';
                html += '<div class="custom-tab-bar"><div class="custom-tab-scroll">';
                this.categories.forEach(c => {
                    const active = (this.customSelectedCat === c.key) ? ' active' : '';
                    html += `<button class="custom-tab-item${active}" data-select-cat="${this.escapeHtml(c.key)}">${this.escapeHtml(c.label)}</button>`;
                });
                html += '<button class="custom-tab-item add-tab" id="addCatTabBtn">＋</button>';
                html += '</div></div>';

                if (this.customSelectedCat) {
                    const cat = this.categories.find(c => c.key === this.customSelectedCat);
                    if (cat) {
                        const songCount = this.songs.filter(s => s.category === cat.key).length;
                        html += '<div class="custom-cat-header">';
                        html += `<span class="custom-cat-header-name">${this.escapeHtml(cat.label)} <span class="custom-item-sub">(${songCount} 首歌曲)</span></span>`;
                        html += `<button class="custom-action-btn text-btn edit" data-edit-cat="${this.escapeHtml(cat.key)}">✎ 編輯</button>`;
                        html += `<button class="custom-action-btn text-btn delete" data-del-cat="${this.escapeHtml(cat.key)}">✕ 刪除</button>`;
                        html += '</div>';

                        const subcats = cat.subcategories || [];
                        html += '<div class="custom-section">';
                        html += '<div class="custom-section-header">';
                        html += `<div class="custom-section-left" id="toggleSubcatSection"><span class="custom-section-title">子分類</span><span class="custom-section-count">(${subcats.length})</span><span class="custom-section-toggle">${this.customSubcatExpanded ? '▾ 閉合' : '▸ 展開'}</span></div>`;
                        html += '<div class="custom-section-actions"><button class="custom-add-btn" id="addSubcatBtn">＋ 新增</button></div></div>';
                        html += `<div class="custom-section-content${this.customSubcatExpanded ? '' : ' collapsed'}" id="subcatContent">`;
                        if (!subcats.length) { html += '<div class="list-empty" style="padding:16px;">尚無子分類</div>'; }
                        else { subcats.forEach(sc => { const scCount = this.songs.filter(s => s.category === cat.key && s.subcategory === sc).length; html += `<div class="custom-subcat-item"><span class="custom-item-name">${this.escapeHtml(sc)} <span class="custom-item-sub">(${scCount} 首)</span></span><button class="custom-action-btn delete" data-del-subcat="${this.escapeHtml(sc)}" data-subcat-cat="${this.escapeHtml(cat.key)}">✕</button></div>`; }); }
                        html += '</div></div>';

                        const songsInCat = this.songs.filter(s => s.category === cat.key);
                        html += '<div class="custom-section">';
                        html += '<div class="custom-section-header">';
                        html += `<div class="custom-section-left" id="toggleSongsSection"><span class="custom-section-title">歌曲</span><span class="custom-section-count">(${songsInCat.length})</span><span class="custom-section-toggle">${this.customSongsExpanded ? '▾ 閉合' : '▸ 展開'}</span></div>`;
                        html += '<div class="custom-section-actions"><button class="custom-add-btn" id="addSongBtn">＋ 新增</button></div></div>';
                        html += `<div class="custom-section-content${this.customSongsExpanded ? '' : ' collapsed'}" id="songsContent">`;
                        if (!songsInCat.length) { html += '<div class="list-empty" style="padding:16px;">此分類下沒有歌曲</div>'; }
                        else { songsInCat.forEach(s => { const key = this.songKey(s); html += `<div class="custom-item"><span class="custom-item-name">${this.escapeHtml(s.title)} <span class="custom-item-sub">${this.escapeHtml(s.sub || '')}</span></span><button class="custom-action-btn edit" data-edit-song="${this.escapeHtml(key)}">✎</button><button class="custom-action-btn delete" data-del-song="${this.escapeHtml(key)}">✕</button></div>`; }); }
                        html += '</div></div>';
                    }
                } else {
                    html += '<div class="list-empty" style="padding:40px 24px;">請選擇一個分類<br>或點擊「＋」新增分類</div>';
                }
                container.innerHTML = html;

                /* 設定展開區域的 max-height */
                const subcatContent = document.getElementById('subcatContent');
                if (subcatContent && this.customSubcatExpanded) subcatContent.style.maxHeight = subcatContent.scrollHeight + 'px';
                const songsContent = document.getElementById('songsContent');
                if (songsContent && this.customSongsExpanded) songsContent.style.maxHeight = songsContent.scrollHeight + 'px';

                /* 綁定事件 */
                container.querySelectorAll('[data-select-cat]').forEach(btn => { btn.addEventListener('click', function() { app.customSelectedCat = this.dataset.selectCat; app.customSubcatExpanded = false; app.customSongsExpanded = false; app.renderCustom(); }); });
                const addCatTabBtn = document.getElementById('addCatTabBtn');
                if (addCatTabBtn) addCatTabBtn.addEventListener('click', () => app.showCategoryModal());
                container.querySelectorAll('[data-edit-cat]').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); const key = btn.dataset.editCat; const cat = app.categories.find(c => c.key === key); if (cat) app.showCategoryModal(cat); }); });
                container.querySelectorAll('[data-del-cat]').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); const key = btn.dataset.delCat; const cat = app.categories.find(c => c.key === key); if (cat) app.confirmDeleteCategory(cat); }); });
                const toggleSubcatSection = document.getElementById('toggleSubcatSection');
                if (toggleSubcatSection) toggleSubcatSection.addEventListener('click', () => { app.customSubcatExpanded = !app.customSubcatExpanded; app.renderCustom(); });
                const addSubcatBtn = document.getElementById('addSubcatBtn');
                if (addSubcatBtn) addSubcatBtn.addEventListener('click', () => app.showSubcategoryModal());
                container.querySelectorAll('[data-del-subcat]').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); app.confirmDeleteSubcategory(btn.dataset.delSubcat, btn.dataset.subcatCat); }); });
                const toggleSongsSection = document.getElementById('toggleSongsSection');
                if (toggleSongsSection) toggleSongsSection.addEventListener('click', () => { app.customSongsExpanded = !app.customSongsExpanded; app.renderCustom(); });
                const addSongBtn = document.getElementById('addSongBtn');
                if (addSongBtn) addSongBtn.addEventListener('click', () => app.showSongModal());
                container.querySelectorAll('[data-edit-song]').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); const key = btn.dataset.editSong; const song = app.songs.find(s => app.songKey(s) === key); if (song) app.showSongModal(song); }); });
                container.querySelectorAll('[data-del-song]').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); const key = btn.dataset.delSong; const song = app.songs.find(s => app.songKey(s) === key); if (song) app.confirmDeleteSong(song); }); });
            }

            showCategoryModal(existingCat) {
                const isEdit = !!existingCat;
                const title = isEdit ? '編輯分類' : '新增分類';
                const nameVal = isEdit ? this.escapeHtml(existingCat.label) : '';
                const bodyHtml = `<div class="form-group"><label class="form-label">分類名稱</label><input class="form-input" id="catNameInput" type="text" placeholder="請輸入分類名稱" value="${nameVal}" maxlength="20" /></div>`;
                const footerHtml = `<button class="modal-btn cancel" id="modalCancelBtn">取消</button><button class="modal-btn confirm" id="modalConfirmBtn">確認</button>`;
                this.showModal(title, bodyHtml, footerHtml);
                document.getElementById('modalCancelBtn').addEventListener('click', () => app.hideModal());
                document.getElementById('modalConfirmBtn').addEventListener('click', () => {
                    const name = document.getElementById('catNameInput').value.trim();
                    if (!name) { app.showToast('請輸入分類名稱', 'error'); return; }
                    const duplicate = app.categories.find(c => c.label === name && (!isEdit || c.key !== existingCat.key));
                    if (duplicate) { app.showToast('此分類名稱已存在', 'error'); return; }
                    if (isEdit) { existingCat.label = name; app.saveCategories(); app.showToast('分類已更新', 'success'); }
                    else { const newCat = { key: app.generateCatKey(), label: name, subcategories: [] }; app.categories.push(newCat); app.customSelectedCat = newCat.key; app.saveCategories(); app.showToast('分類已新增', 'success'); }
                    app.hideModal(); app.renderCustom();
                });
                setTimeout(() => { const input = document.getElementById('catNameInput'); if (input) input.focus(); }, 300);
            }

            confirmDeleteCategory(cat) {
                const count = this.songs.filter(s => s.category === cat.key).length;
                let msg = `確定要刪除分類「<strong>${this.escapeHtml(cat.label)}</strong>」嗎？`;
                if (count > 0) msg += `<br>該分類下的 ${count} 首歌曲也將一併刪除。`;
                const bodyHtml = `<div class="confirm-text">${msg}</div>`;
                const footerHtml = `<button class="modal-btn cancel" id="modalCancelBtn">取消</button><button class="modal-btn danger" id="modalConfirmBtn">刪除</button>`;
                this.showModal('確認刪除', bodyHtml, footerHtml);
                document.getElementById('modalCancelBtn').addEventListener('click', () => app.hideModal());
                document.getElementById('modalConfirmBtn').addEventListener('click', () => {
                    const catSongs = app.songs.filter(s => s.category === cat.key);
                    catSongs.forEach(s => { const key = app.songKey(s); app.bookmarks = app.bookmarks.filter(b => b !== key); app.cleanupOrderData(key); });
                    app.cleanupCategoryOrderData(cat.key);
                    app.songs = app.songs.filter(s => s.category !== cat.key);
                    app.categories = app.categories.filter(c => c.key !== cat.key);
                    if (app.customSelectedCat === cat.key) app.customSelectedCat = '';
                    app.saveCategories(); app.saveSongs(); app.saveBookmarks();
                    app.hideModal(); app.showToast('分類已刪除', 'success'); app.renderCustom();
                });
            }

            showSubcategoryModal() {
                if (!this.customSelectedCat) { this.showToast('請先選擇分類', 'error'); return; }
                const cat = this.categories.find(c => c.key === this.customSelectedCat);
                if (!cat) return;
                const bodyHtml = `<div class="form-group"><label class="form-label">子分類名稱</label><input class="form-input" id="subcatNameInput" type="text" placeholder="請輸入子分類名稱" maxlength="20" /></div>`;
                const footerHtml = `<button class="modal-btn cancel" id="modalCancelBtn">取消</button><button class="modal-btn confirm" id="modalConfirmBtn">確認</button>`;
                this.showModal('新增子分類', bodyHtml, footerHtml);
                document.getElementById('modalCancelBtn').addEventListener('click', () => app.hideModal());
                document.getElementById('modalConfirmBtn').addEventListener('click', () => {
                    const name = document.getElementById('subcatNameInput').value.trim();
                    if (!name) { app.showToast('請輸入子分類名稱', 'error'); return; }
                    if (!cat.subcategories) cat.subcategories = [];
                    if (cat.subcategories.includes(name)) { app.showToast('此子分類已存在', 'error'); return; }
                    cat.subcategories.unshift(name);
                    app.customSubcatExpanded = true;
                    app.saveCategories(); app.hideModal(); app.showToast('子分類已新增', 'success'); app.renderCustom();
                });
                setTimeout(() => { const input = document.getElementById('subcatNameInput'); if (input) input.focus(); }, 300);
            }

            confirmDeleteSubcategory(scName, catKey) {
                const scCount = this.songs.filter(s => s.category === catKey && s.subcategory === scName).length;
                let msg = `確定要刪除子分類「<strong>${this.escapeHtml(scName)}</strong>」嗎？`;
                if (scCount > 0) msg += `<br>該子分類下的 ${scCount} 首歌曲的子分類標記將被清除。`;
                const bodyHtml = `<div class="confirm-text">${msg}</div>`;
                const footerHtml = `<button class="modal-btn cancel" id="modalCancelBtn">取消</button><button class="modal-btn danger" id="modalConfirmBtn">刪除</button>`;
                this.showModal('確認刪除', bodyHtml, footerHtml);
                document.getElementById('modalCancelBtn').addEventListener('click', () => app.hideModal());
                document.getElementById('modalConfirmBtn').addEventListener('click', () => {
                    const cat = app.categories.find(c => c.key === catKey);
                    if (cat && cat.subcategories) cat.subcategories = cat.subcategories.filter(sc => sc !== scName);
                    app.songs.forEach(s => { if (s.category === catKey && s.subcategory === scName) s.subcategory = ''; });
                    app.saveCategories(); app.saveSongs(); app.hideModal(); app.showToast('子分類已刪除', 'success'); app.renderCustom();
                });
            }

            showSongModal(existingSong) {
                const isEdit = !!existingSong;
                const title = isEdit ? '編輯歌曲' : '新增歌曲';
                let catOptions = '<option value="">-- 選擇分類 --</option>';
                this.categories.forEach(c => {
                    const sel = (isEdit && existingSong.category === c.key) ? ' selected' : (!isEdit && this.customSelectedCat === c.key) ? ' selected' : '';
                    catOptions += `<option value="${this.escapeHtml(c.key)}"${sel}>${this.escapeHtml(c.label)}</option>`;
                });
                const defaultCat = isEdit ? existingSong.category : this.customSelectedCat;
                const catForSubcat = this.categories.find(c => c.key === defaultCat);
                let subcatOptions = '<option value="">-- 無 --</option>';
                if (catForSubcat && catForSubcat.subcategories) {
                    catForSubcat.subcategories.forEach(sc => {
                        const sel = (isEdit && existingSong.subcategory === sc) ? ' selected' : '';
                        subcatOptions += `<option value="${this.escapeHtml(sc)}"${sel}>${this.escapeHtml(sc)}</option>`;
                    });
                }
                const bodyHtml = `
                    <div class="form-group"><label class="form-label">所屬分類</label><select class="form-select" id="songCatSelect">${catOptions}</select></div>
                    <div class="form-group"><label class="form-label">歌曲標題</label><input class="form-input" id="songTitleInput" type="text" placeholder="請輸入歌曲標題" value="${isEdit ? this.escapeHtml(existingSong.title) : ''}" maxlength="50" /></div>
                    <div class="form-group"><label class="form-label">演唱者</label><input class="form-input" id="songSubInput" type="text" placeholder="請輸入演唱者（選填）" value="${isEdit ? this.escapeHtml(existingSong.sub || '') : ''}" maxlength="50" /></div>
                    <div class="form-group"><label class="form-label">子分類</label><select class="form-select" id="songSubcatSelect">${subcatOptions}</select></div>
                    <div class="form-group"><label class="form-label">歌詞</label><textarea class="form-input" id="songLyricsInput" placeholder="請輸入歌詞內容">${isEdit ? this.escapeHtml(existingSong.lyrics || '') : ''}</textarea></div>`;
                const footerHtml = `<button class="modal-btn cancel" id="modalCancelBtn">取消</button><button class="modal-btn confirm" id="modalConfirmBtn">確認</button>`;
                this.showModal(title, bodyHtml, footerHtml);

                document.getElementById('songCatSelect').addEventListener('change', function() {
                    const newCat = app.categories.find(c => c.key === this.value);
                    const sel = document.getElementById('songSubcatSelect');
                    if (sel && newCat && newCat.subcategories) {
                        let opts = '<option value="">-- 無 --</option>';
                        newCat.subcategories.forEach(sc => { opts += `<option value="${app.escapeHtml(sc)}">${app.escapeHtml(sc)}</option>`; });
                        sel.innerHTML = opts;
                    } else if (sel) { sel.innerHTML = '<option value="">-- 無 --</option>'; }
                });

                document.getElementById('modalCancelBtn').addEventListener('click', () => app.hideModal());
                document.getElementById('modalConfirmBtn').addEventListener('click', () => {
                    const catKey = document.getElementById('songCatSelect').value;
                    const titleVal = document.getElementById('songTitleInput').value.trim();
                    const subVal = document.getElementById('songSubInput').value.trim();
                    const subcatVal = document.getElementById('songSubcatSelect').value;
                    const lyricsVal = document.getElementById('songLyricsInput').value;
                    if (!catKey) { app.showToast('請選擇所屬分類', 'error'); return; }
                    if (!titleVal) { app.showToast('請輸入歌曲標題', 'error'); return; }
                    if (isEdit) {
                        const oldKey = app.songKey(existingSong);
                        existingSong.category = catKey; existingSong.title = titleVal; existingSong.sub = subVal; existingSong.subcategory = subcatVal; existingSong.lyrics = lyricsVal;
                        const newKey = app.songKey(existingSong);
                        if (oldKey !== newKey) {
                            const bmIdx = app.bookmarks.indexOf(oldKey);
                            if (bmIdx >= 0) { app.bookmarks[bmIdx] = newKey; app.saveBookmarks(); }
                            Object.keys(app.songOrders).forEach(ok => { const idx = app.songOrders[ok].indexOf(oldKey); if (idx >= 0) app.songOrders[ok][idx] = newKey; });
                            app.bookmarkOrder = app.bookmarkOrder.map(k => k === oldKey ? newKey : k);
                            Object.keys(app.pinnedItems).forEach(ok => { const idx = app.pinnedItems[ok].indexOf(oldKey); if (idx >= 0) app.pinnedItems[ok][idx] = newKey; });
                            app.saveSongOrders(); app.saveBookmarkOrder(); app.savePinnedItems();
                            delete app.highlights[oldKey]; app.saveHighlights();
                        } else if (existingSong.lyrics !== lyricsVal) {
                            delete app.highlights[oldKey]; app.saveHighlights();
                        }
                        app.saveSongs(); app.showToast('歌曲已更新', 'success');
                    } else {
                        const newSong = { category: catKey, title: titleVal, sub: subVal, subcategory: subcatVal, lyrics: lyricsVal };
                        app.songs.push(newSong);
                        const newKey = app.songKey(newSong);
                        const catObj = app.categories.find(c => c.key === catKey);
                        if (catObj) {
                            const filters = ['所有', ...(catObj.subcategories || [])];
                            filters.forEach(f => { const ok = catKey + '_' + f; if (!app.songOrders[ok]) app.songOrders[ok] = []; app.songOrders[ok].unshift(newKey); });
                            app.saveSongOrders();
                        }
                        app.customSongsExpanded = true;
                        app.saveSongs(); app.showToast('歌曲已新增', 'success');
                    }
                    app.hideModal(); app.customSelectedCat = catKey; app.renderCustom();
                });
                setTimeout(() => { const input = document.getElementById('songTitleInput'); if (input) input.focus(); }, 300);
            }

            confirmDeleteSong(song) {
                const msg = `確定要刪除歌曲「<strong>${this.escapeHtml(song.title)}</strong>」嗎？`;
                const bodyHtml = `<div class="confirm-text">${msg}</div>`;
                const footerHtml = `<button class="modal-btn cancel" id="modalCancelBtn">取消</button><button class="modal-btn danger" id="modalConfirmBtn">刪除</button>`;
                this.showModal('確認刪除', bodyHtml, footerHtml);
                document.getElementById('modalCancelBtn').addEventListener('click', () => app.hideModal());
                document.getElementById('modalConfirmBtn').addEventListener('click', () => {
                    const key = app.songKey(song);
                    app.songs = app.songs.filter(s => app.songKey(s) !== key);
                    app.bookmarks = app.bookmarks.filter(b => b !== key);
                    app.cleanupOrderData(key);
                    delete app.highlights[key];
                    app.saveSongs(); app.saveBookmarks(); app.saveHighlights();
                    app.hideModal(); app.showToast('歌曲已刪除', 'success'); app.renderCustom();
                });
            }

            /* ============================================================
               渲染：設定頁
               ============================================================ */
            renderSettings() {
                const container = document.getElementById('settingsContent');
                if (!container) return;
                let html = '';
                html += '<div class="settings-group"><div class="settings-group-title">顯示設定</div>';
                html += '<div class="settings-item"><div class="settings-item-left"><div class="settings-item-label">歌詞字體大小</div></div><div class="settings-btn-group">';
                html += `<button class="settings-btn ${this.settings.fontSize === 'small' ? 'active' : ''}" data-font-size="small">小</button>`;
                html += `<button class="settings-btn ${this.settings.fontSize === 'medium' ? 'active' : ''}" data-font-size="medium">中</button>`;
                html += `<button class="settings-btn ${this.settings.fontSize === 'large' ? 'active' : ''}" data-font-size="large">大</button>`;
                html += '</div></div>';
                html += '<div class="settings-item"><div class="settings-item-left"><div class="settings-item-label">外觀主題</div></div><div class="settings-btn-group">';
                html += `<button class="settings-btn ${this.settings.theme === 'light' ? 'active' : ''}" data-theme="light">明亮</button>`;
                html += `<button class="settings-btn ${this.settings.theme === 'dark' ? 'active' : ''}" data-theme="dark">深暗</button>`;
                html += '</div></div></div>';

                html += '<div class="settings-group"><div class="settings-group-title">資料管理</div>';
                html += '<div class="settings-item"><div class="settings-item-left"><div class="settings-item-label">匯出完整備份</div><div class="settings-item-desc">將所有資料（含書籤、設定、螢光筆）匯出為 JSON</div></div><button class="settings-action-btn" id="exportFullBtn">匯出</button></div>';
                html += '<div class="settings-item"><div class="settings-item-left"><div class="settings-item-label">匯出歌曲資料</div><div class="settings-item-desc">僅匯出分類與歌曲，作為 data.json</div></div><button class="settings-action-btn" id="exportDataJsonBtn">匯出</button></div>';
                html += '<div class="data-json-note"><strong>data.json 使用方式：</strong>將匯出的檔案命名為 <strong>data.json</strong>，放在與 <strong>index.html</strong> 同目錄下，App 啟動時會自動載入。</div>';
                html += '<div class="settings-item"><div class="settings-item-left"><div class="settings-item-label">匯入資料</div><div class="settings-item-desc">完整備份匯入或批量歌曲匯入</div></div><button class="settings-action-btn" id="importBtn">匯入</button></div>';
                html += '<div class="settings-item"><div class="settings-item-left"><div class="settings-item-label">清除所有資料</div><div class="settings-item-desc">恢復為預設資料</div></div><button class="settings-action-btn danger" id="clearBtn">清除</button></div></div>';

                html += '<div class="settings-about"><div class="app-name">📖 歌詞簿</div><div>版本 2.2.0</div><div>你的隨身歌詞本</div><div style="margin-top:6px;">支援 data.json 外部資料載入 · 螢光筆注記</div></div>';
                container.innerHTML = html;

                container.querySelectorAll('[data-font-size]').forEach(btn => { btn.addEventListener('click', function() { app.settings.fontSize = this.dataset.fontSize; app.saveSettings(); app.applySettings(); app.renderSettings(); app.showToast('字體大小已更新', 'success'); }); });
                container.querySelectorAll('[data-theme]').forEach(btn => { btn.addEventListener('click', function() { app.settings.theme = this.dataset.theme; app.saveSettings(); app.applySettings(); app.renderSettings(); app.showToast('主題已切換', 'success'); }); });
                const exportFullBtn = document.getElementById('exportFullBtn');
                if (exportFullBtn) exportFullBtn.addEventListener('click', () => app.exportFullBackup());
                const exportDataJsonBtn = document.getElementById('exportDataJsonBtn');
                if (exportDataJsonBtn) exportDataJsonBtn.addEventListener('click', () => app.exportDataJson());
                const importBtn = document.getElementById('importBtn');
                if (importBtn) importBtn.addEventListener('click', () => app.showImportModal());
                const clearBtn = document.getElementById('clearBtn');
                if (clearBtn) clearBtn.addEventListener('click', () => app.confirmClearData());
            }

            async exportFullBackup() {
                try {
                    const data = {
                        categories: this.categories, songs: this.songs, bookmarks: this.bookmarks,
                        settings: { fontSize: this.settings.fontSize, theme: this.settings.theme },
                        songOrders: this.songOrders, bookmarkOrder: this.bookmarkOrder, pinnedItems: this.pinnedItems,
                        highlights: this.highlights, colorMeanings: this.colorMeanings,
                        exportTime: new Date().toISOString(), type: 'full_backup'
                    };
                    const jsonStr = JSON.stringify(data, null, 2);
                    const blob = new Blob([jsonStr], { type: 'application/json' });
                    const filename = 'lyrics_book_backup_' + new Date().toISOString().slice(0, 10) + '.json';
                    if (typeof wusiShare === 'function') {
                        await wusiShare({ blob: blob, filename: filename, title: '歌詞簿完整備份' });
                        this.showToast('完整備份已匯出', 'success');
                    } else {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a'); a.href = url; a.download = filename;
                        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
                        this.showToast('完整備份已下載', 'success');
                    }
                } catch (e) { console.error('exportFullBackup error:', e); this.showToast('匯出失敗：' + e.message, 'error'); }
            }

            async exportDataJson() {
                try {
                    const data = {
                        categories: this.categories.map(c => ({ key: c.key, label: c.label, subcategories: [...(c.subcategories || [])] })),
                        songs: this.songs.map(s => ({ category: s.category, title: s.title, sub: s.sub || '', subcategory: s.subcategory || '', lyrics: s.lyrics || '' })),
                        version: '2.2.0', exportTime: new Date().toISOString(), type: 'data_json'
                    };
                    const jsonStr = JSON.stringify(data, null, 2);
                    const blob = new Blob([jsonStr], { type: 'application/json' });
                    const filename = 'data.json';
                    if (typeof wusiShare === 'function') {
                        await wusiShare({ blob: blob, filename: filename, title: '歌詞簿歌曲資料 (data.json)' });
                        this.showToast('data.json 已匯出', 'success');
                    } else {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a'); a.href = url; a.download = filename;
                        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
                        this.showToast('data.json 已下載', 'success');
                    }
                } catch (e) { console.error('exportDataJson error:', e); this.showToast('匯出失敗：' + e.message, 'error'); }
            }

            showImportModal() {
                this.importMode = 'full';
                const fullPlaceholder = '將匯出的完整 JSON 內容貼在此處\n包含 categories, songs, bookmarks 等所有資料';
                const batchPlaceholder = '貼上歌曲 JSON 陣列，格式如：\n[\n  {"category":"zh","title":"小幸運","sub":"田馥甄","subcategory":"抒情","lyrics":"歌詞內容..."},\n  {...}\n]';
                const fullHint = '完整匯入會<strong>覆蓋</strong>所有現有資料（分類、歌曲、書籤、設定等），請確認已備份。';
                const batchHint = '批量匯入會將歌曲<strong>追加</strong>到現有列表中，不覆蓋原有資料。每首歌曲需包含 <code>category</code> 和 <code>title</code> 欄位。';
                const bodyHtml = `
                    <div class="import-mode-tabs"><button class="import-mode-tab active" id="importModeFull">完整匯入</button><button class="import-mode-tab" id="importModeBatch">批量匯入</button></div>
                    <div class="import-hint" id="importHint">${fullHint}</div>
                    <div class="form-group"><label class="form-label" id="importLabel">完整備份 JSON</label><textarea class="form-input" id="importJsonInput" placeholder="${fullPlaceholder}" style="min-height:160px;font-size:12px;"></textarea></div>`;
                const footerHtml = `<button class="modal-btn cancel" id="modalCancelBtn">取消</button><button class="modal-btn confirm" id="modalConfirmBtn">匯入</button>`;
                this.showModal('匯入資料', bodyHtml, footerHtml);
                document.getElementById('importModeFull').addEventListener('click', () => {
                    app.importMode = 'full';
                    document.getElementById('importModeFull').classList.add('active'); document.getElementById('importModeBatch').classList.remove('active');
                    document.getElementById('importHint').innerHTML = fullHint; document.getElementById('importLabel').textContent = '完整備份 JSON';
                    document.getElementById('importJsonInput').placeholder = fullPlaceholder; document.getElementById('importJsonInput').value = '';
                });
                document.getElementById('importModeBatch').addEventListener('click', () => {
                    app.importMode = 'batch';
                    document.getElementById('importModeBatch').classList.add('active'); document.getElementById('importModeFull').classList.remove('active');
                    document.getElementById('importHint').innerHTML = batchHint; document.getElementById('importLabel').textContent = '歌曲 JSON 陣列';
                    document.getElementById('importJsonInput').placeholder = batchPlaceholder; document.getElementById('importJsonInput').value = '';
                });
                document.getElementById('modalCancelBtn').addEventListener('click', () => app.hideModal());
                document.getElementById('modalConfirmBtn').addEventListener('click', () => {
                    const jsonStr = document.getElementById('importJsonInput').value.trim();
                    if (!jsonStr) { app.showToast('請貼上 JSON 資料', 'error'); return; }
                    if (app.importMode === 'full') app.handleFullImport(jsonStr);
                    else app.handleBatchImport(jsonStr);
                });
            }

            handleFullImport(jsonStr) {
                try {
                    const data = JSON.parse(jsonStr);
                    if (!data.categories || !Array.isArray(data.categories)) throw new Error('缺少 categories 資料');
                    if (!data.songs || !Array.isArray(data.songs)) throw new Error('缺少 songs 資料');
                    this.categories = data.categories; this.songs = data.songs;
                    this.bookmarks = (data.bookmarks && Array.isArray(data.bookmarks)) ? data.bookmarks : [];
                    if (data.settings && typeof data.settings === 'object') { this.settings.fontSize = data.settings.fontSize || this.settings.fontSize; this.settings.theme = data.settings.theme || this.settings.theme; }
                    this.songOrders = (data.songOrders && typeof data.songOrders === 'object') ? data.songOrders : {};
                    this.bookmarkOrder = (data.bookmarkOrder && Array.isArray(data.bookmarkOrder)) ? data.bookmarkOrder : [];
                    this.pinnedItems = (data.pinnedItems && typeof data.pinnedItems === 'object') ? data.pinnedItems : {};
                    this.highlights = (data.highlights && typeof data.highlights === 'object') ? data.highlights : {};
                    this.colorMeanings = (data.colorMeanings && Array.isArray(data.colorMeanings) && data.colorMeanings.length === HIGHLIGHT_COLORS.length) ? data.colorMeanings : [...DEFAULT_COLOR_MEANINGS];
                    this.ensureSubcategoriesCompat();
                    this.saveCategories(); this.saveSongs(); this.saveBookmarks(); this.saveSettings();
                    this.saveSongOrders(); this.saveBookmarkOrder(); this.savePinnedItems();
                    this.saveHighlights(); this.saveColorMeanings();
                    this.applySettings(); this.customSelectedCat = '';
                    this.hideModal(); this.showToast('資料匯入成功', 'success'); this.switchView('catalog');
                } catch (e) { console.error('fullImport error:', e); this.showToast('匯入失敗：' + e.message, 'error'); }
            }

            handleBatchImport(jsonStr) {
                try {
                    let songList = JSON.parse(jsonStr);
                    if (!Array.isArray(songList)) {
                        if (typeof songList === 'object' && songList.title) songList = [songList];
                        else throw new Error('資料格式錯誤：需要 JSON 陣列');
                    }
                    if (songList.length === 0) throw new Error('歌曲陣列為空');
                    const validSongs = [];
                    const errors = [];
                    songList.forEach((s, idx) => {
                        if (!s.category || !s.title) { errors.push(`第 ${idx + 1} 首：缺少 category 或 title`); return; }
                        const catExists = this.categories.find(c => c.key === s.category);
                        if (!catExists) { errors.push(`第 ${idx + 1} 首「${s.title || '?'}」：分類 "${s.category}" 不存在`); return; }
                        const key = this.songKey(s);
                        const duplicate = this.songs.find(existing => this.songKey(existing) === key);
                        if (duplicate) { errors.push(`第 ${idx + 1} 首「${s.title}」：已存在`); return; }
                        validSongs.push({ category: s.category, title: s.title, sub: s.sub || '', subcategory: s.subcategory || '', lyrics: s.lyrics || '' });
                    });
                    if (validSongs.length === 0) { this.showToast('無有效歌曲可匯入', 'error'); console.warn('批量匯入錯誤：', errors); return; }
                    validSongs.forEach(song => {
                        this.songs.push(song);
                        if (song.subcategory) { const cat = this.categories.find(c => c.key === song.category); if (cat && cat.subcategories && !cat.subcategories.includes(song.subcategory)) cat.subcategories.push(song.subcategory); }
                        const newKey = this.songKey(song);
                        const catObj = this.categories.find(c => c.key === song.category);
                        if (catObj) { const filters = ['所有', ...(catObj.subcategories || [])]; filters.forEach(f => { const ok = song.category + '_' + f; if (!this.songOrders[ok]) this.songOrders[ok] = []; this.songOrders[ok].unshift(newKey); }); }
                    });
                    this.saveSongs(); this.saveCategories(); this.saveSongOrders();
                    this.hideModal();
                    if (errors.length > 0) console.warn('批量匯入部分失敗：', errors);
                    this.showToast(`已匯入 ${validSongs.length} 首歌曲`, 'success');
                    this.switchView('catalog');
                } catch (e) { console.error('batchImport error:', e); this.showToast('匯入失敗：' + e.message, 'error'); }
            }

            confirmClearData() {
                const bodyHtml = '<div class="confirm-text">確定要清除所有資料嗎？<br>此操作將恢復為預設資料，無法復原。</div>';
                const footerHtml = `<button class="modal-btn cancel" id="modalCancelBtn">取消</button><button class="modal-btn danger" id="modalConfirmBtn">清除</button>`;
                this.showModal('確認清除', bodyHtml, footerHtml);
                document.getElementById('modalCancelBtn').addEventListener('click', () => app.hideModal());
                document.getElementById('modalConfirmBtn').addEventListener('click', async () => {
                    try {
                        app.categories = DEFAULT_CATEGORIES.map(c => ({ ...c, subcategories: [...(c.subcategories || [])] }));
                        app.songs = DEFAULT_SONGS.map(s => ({ ...s }));
                        app.bookmarks = []; app.settings = { ...DEFAULT_SETTINGS };
                        app.songOrders = {}; app.bookmarkOrder = []; app.pinnedItems = {};
                        app.highlights = {}; app.colorMeanings = [...DEFAULT_COLOR_MEANINGS];
                        app.customSelectedCat = '';
                        await app.saveCategories(); await app.saveSongs(); await app.saveBookmarks();
                        await app.saveSettings(); await app.saveSongOrders(); await app.saveBookmarkOrder();
                        await app.savePinnedItems(); await app.saveHighlights(); await app.saveColorMeanings();
                        app.applySettings(); app.hideModal();
                        app.showToast('資料已清除並恢復預設', 'success'); app.switchView('catalog');
                    } catch (e) { console.error('clearData error:', e); app.showToast('操作失敗', 'error'); }
                });
            }

            /* ============================================================
               模態彈窗系統
               ============================================================ */
            showModal(title, bodyHtml, footerHtml) {
                document.getElementById('modalTitle').textContent = title;
                document.getElementById('modalBody').innerHTML = bodyHtml;
                document.getElementById('modalFooter').innerHTML = footerHtml;
                document.getElementById('modalOverlay').classList.remove('hidden');
            }

            hideModal() {
                document.getElementById('modalOverlay').classList.add('hidden');
            }

            /* ============================================================
               Toast 提示
               ============================================================ */
            showToast(message, type) {
                type = type || 'info';
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = 'toast ' + type;
                toast.textContent = message;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.classList.add('out');
                    setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 200);
                }, 2000);
            }
        }

        /* ============================================================
           啟動應用
           ============================================================ */
        const app = new App();

        document.addEventListener('DOMContentLoaded', () => {
            const initTimeout = setTimeout(() => {
                console.warn('DOMContentLoaded timeout, forcing init');
                app.init().catch(e => console.error('App init error (timeout):', e));
            }, 3000);
            app.init().then(() => {
                clearTimeout(initTimeout);
            }).catch(e => {
                clearTimeout(initTimeout);
                console.error('App init error:', e);
            });
        });
    })();
    </script>
</body>
</html>

        @keyframes toastOut { from{opacity:1} to{opacity:0;transform:translateY(-8px)} }
        .confirm-text { font-size:14px; color:var(--color-text-secondary); line-height:1.6; text-align:center; padding:8px 0; }
        .confirm-text strong { color:var(--color-text-primary); }

        .sort-song-info .sort-song-title { font-size:16px; font-weight:600; color:var(--color-text-primary); }
        .sort-song-info .sort-song-sub { font-size:13px; color:var(--color-text-tertiary); margin-top:2px; }
        .sort-actions { display:flex; flex-direction:column; gap:8px; }
        .sort-action-btn { width:100%; padding:12px 16px; border-radius:var(--radius-md); font-size:14px; font-weight:500; border:1px solid var(--color-border); background:var(--color-surface); color:var(--color-text-primary); cursor:pointer; transition:all .15s; text-align:left; display:flex; align-items:center; gap:10px; }
        .sort-action-btn:active { transform:scale(.97); background:var(--color-primary-surface); }

        .data-json-note { font-size:12px; color:var(--color-text-tertiary); line-height:1.5; padding:10px 12px; background:var(--color-primary-surface); border-radius:var(--radius-sm); border:1px solid var(--color-border-light); margin-top:8px; }
        .data-json-note strong { color:var(--color-primary); font-weight:500; }
        @media (max-width:380px) { .nav-title{font-size:15px} .tag-item{font-size:12px;padding:4px 10px;height:26px} .list-item{padding:10px 12px;min-height:44px} .custom-tab-item{font-size:12px;padding:5px 12px;height:30px} .hl-color-btn{width:26px;height:26px} }

</head>
<body>
    <div id="app">
        <header id="navBar">
            <div id="navContent">

        <main id="contentArea">

            <section class="view active" id="viewCatalog">

                    <input type="text" class="search-input" id="catalogSearchInput" placeholder="搜索歌曲名稱或演唱者..." />

                </div>
                <div class="list-scroll" id="catalogList"></div>
            </section>
            <!-- 分類視圖 -->
            <section class="view" id="viewCategory">
                <div class="tag-filter"><div class="tag-scroll" id="tagScroll"></div></div>
                <div class="list-scroll" id="songList"></div>
            </section>
            <!-- 書籤視圖 -->
            <section class="view" id="viewBookmark">

            </section>
            <!-- 設定視圖 -->
            <section class="view" id="viewSettings">
                <div class="list-scroll" id="settingsContent"></div>
            </section>
            <!-- 歌詞詳情視圖：含螢光筆工具欄 -->
            <section class="view" id="viewLyricsDetail">
                <div class="list-scroll" id="lyricsDetailContent"></div>
                <div class="highlight-toolbar" id="highlightToolbar">
                    <div class="highlight-toolbar-row" id="hlToolbarRow"></div>

                </div>
            </section>
        </main>
        <nav id="bottomNav">
            <button class="nav-tab active" data-view="catalog"><span class="tab-icon">📋</span><span class="tab-label">目錄</span></button>
            <button class="nav-tab" data-view="bookmark"><span class="tab-icon">🔖</span><span class="tab-label">書籤</span></button>
