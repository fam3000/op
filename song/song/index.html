                const title = isEdit ? '編輯歌曲' : '新增歌曲';
                let catOptions = '<option value="">-- 選擇分類 --</option>';
                this.categories.forEach(c => {
                    const sel = (isEdit && existingSong.category === c.key) ? ' selected' : (!isEdit && this.customSelectedCat === c.key) ? ' selected' : '';
                    catOptions += `<option value="${this.escapeHtml(c.key)}"${sel}>${this.escapeHtml(c.label)}</option>`;
                });
                const defaultCat = isEdit ? existingSong.category : this.customSelectedCat;
                const catForSubcat = this.categories.find(c => c.key === defaultCat);
                let subcatOptions = '<option value="">-- 無 --</option>';
                if (catForSubcat && catForSubcat.subcategories) {
                    catForSubcat.subcategories.forEach(sc => {
                        const sel = (isEdit && existingSong.subcategory === sc) ? ' selected' : '';
                        subcatOptions += `<option value="${this.escapeHtml(sc)}"${sel}>${this.escapeHtml(sc)}</option>`;
                    });
                }
                const bodyHtml = `
                    <div class="form-group"><label class="form-label">所屬分類</label><select class="form-select" id="songCatSelect">${catOptions}</select></div>
                    <div class="form-group"><label class="form-label">歌曲標題</label><input class="form-input" id="songTitleInput" type="text" placeholder="請輸入歌曲標題" value="${isEdit ? this.escapeHtml(existingSong.title) : ''}" maxlength="50" /></div>
                    <div class="form-group"><label class="form-label">演唱者</label><input class="form-input" id="songSubInput" type="text" placeholder="請輸入演唱者（選填）" value="${isEdit ? this.escapeHtml(existingSong.sub || '') : ''}" maxlength="50" /></div>
                    <div class="form-group"><label class="form-label">子分類</label><select class="form-select" id="songSubcatSelect">${subcatOptions}</select></div>
                    <div class="form-group"><label class="form-label">歌詞</label><textarea class="form-input" id="songLyricsInput" placeholder="請輸入歌詞內容">${isEdit ? this.escapeHtml(existingSong.lyrics || '') : ''}</textarea></div>`;
                const footerHtml = `<button class="modal-btn cancel" id="modalCancelBtn">取消</button><button class="modal-btn confirm" id="modalConfirmBtn">確認</button>`;
                this.showModal(title, bodyHtml, footerHtml);

                document.getElementById('songCatSelect').addEventListener('change', function() {
                    const newCat = app.categories.find(c => c.key === this.value);
                    const sel = document.getElementById('songSubcatSelect');
                    if (sel && newCat && newCat.subcategories) {
                        let opts = '<option value="">-- 無 --</option>';
                        newCat.subcategories.forEach(sc => { opts += `<option value="${app.escapeHtml(sc)}">${app.escapeHtml(sc)}</option>`; });
                        sel.innerHTML = opts;
                    } else if (sel) { sel.innerHTML = '<option value="">-- 無 --</option>'; }
                });

                document.getElementById('modalCancelBtn').addEventListener('click', () => app.hideModal());
                document.getElementById('modalConfirmBtn').addEventListener('click', () => {
                    const catKey = document.getElementById('songCatSelect').value;
                    const titleVal = document.getElementById('songTitleInput').value.trim();
                    const subVal = document.getElementById('songSubInput').value.trim();
                    const subcatVal = document.getElementById('songSubcatSelect').value;
                    const lyricsVal = document.getElementById('songLyricsInput').value;
                    if (!catKey) { app.showToast('請選擇所屬分類', 'error'); return; }
                    if (!titleVal) { app.showToast('請輸入歌曲標題', 'error'); return; }
                    if (isEdit) {
                        const oldKey = app.songKey(existingSong);
                        existingSong.category = catKey; existingSong.title = titleVal; existingSong.sub = subVal; existingSong.subcategory = subcatVal; existingSong.lyrics = lyricsVal;
                        const newKey = app.songKey(existingSong);
                        if (oldKey !== newKey) {
                            const bmIdx = app.bookmarks.indexOf(oldKey);
                            if (bmIdx >= 0) { app.bookmarks[bmIdx] = newKey; app.saveBookmarks(); }
                            Object.keys(app.songOrders).forEach(ok => { const idx = app.songOrders[ok].indexOf(oldKey); if (idx >= 0) app.songOrders[ok][idx] = newKey; });
                            app.bookmarkOrder = app.bookmarkOrder.map(k => k === oldKey ? newKey : k);
                            Object.keys(app.pinnedItems).forEach(ok => { const idx = app.pinnedItems[ok].indexOf(oldKey); if (idx >= 0) app.pinnedItems[ok][idx] = newKey; });
                            app.saveSongOrders(); app.saveBookmarkOrder(); app.savePinnedItems();
                            delete app.highlights[oldKey]; app.saveHighlights();
                        } else if (existingSong.lyrics !== lyricsVal) {
                            delete app.highlights[oldKey]; app.saveHighlights();
                        }
                        app.saveSongs(); app.showToast('歌曲已更新', 'success');
                    } else {
                        const newSong = { category: catKey, title: titleVal, sub: subVal, subcategory: subcatVal, lyrics: lyricsVal };
                        app.songs.push(newSong);
                        const newKey = app.songKey(newSong);
                        const catObj = app.categories.find(c => c.key === catKey);
                        if (catObj) {
                            const filters = ['所有', ...(catObj.subcategories || [])];
                            filters.forEach(f => { const ok = catKey + '_' + f; if (!app.songOrders[ok]) app.songOrders[ok] = []; app.songOrders[ok].unshift(newKey); });
                            app.saveSongOrders();
                        }
                        app.customSongsExpanded = true;
                        app.saveSongs(); app.showToast('歌曲已新增', 'success');
                    }
                    app.hideModal(); app.customSelectedCat = catKey; app.renderCustom();
                });
                setTimeout(() => { const input = document.getElementById('songTitleInput'); if (input) input.focus(); }, 300);
            }

            async exportFullBackup() {
                try {
                    const data = {
                        categories: this.categories, songs: this.songs, bookmarks: this.bookmarks,
                        settings: { fontSize: this.settings.fontSize, theme: this.settings.theme },
                        songOrders: this.songOrders, bookmarkOrder: this.bookmarkOrder, pinnedItems: this.pinnedItems,
                        highlights: this.highlights, colorMeanings: this.colorMeanings,
                        exportTime: new Date().toISOString(), type: 'full_backup'
                    };
                    const jsonStr = JSON.stringify(data, null, 2);
                    const blob = new Blob([jsonStr], { type: 'application/json' });
                    const filename = 'lyrics_book_backup_' + new Date().toISOString().slice(0, 10) + '.json';
                    if (typeof wusiShare === 'function') {
                        await wusiShare({ blob: blob, filename: filename, title: '歌詞簿完整備份' });
                        this.showToast('完整備份已匯出', 'success');
                    } else {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a'); a.href = url; a.download = filename;
                        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
                        this.showToast('完整備份已下載', 'success');
                    }
                } catch (e) { console.error('exportFullBackup error:', e); this.showToast('匯出失敗：' + e.message, 'error'); }
            }

            async exportDataJson() {
                try {
                    const data = {
                        categories: this.categories.map(c => ({ key: c.key, label: c.label, subcategories: [...(c.subcategories || [])] })),
                        songs: this.songs.map(s => ({ category: s.category, title: s.title, sub: s.sub || '', subcategory: s.subcategory || '', lyrics: s.lyrics || '' })),
                        version: '2.3.0', exportTime: new Date().toISOString(), type: 'data_json'
                    };
                    const jsonStr = JSON.stringify(data, null, 2);
                    const blob = new Blob([jsonStr], { type: 'application/json' });
                    const filename = 'data.json';
                    if (typeof wusiShare === 'function') {
                        await wusiShare({ blob: blob, filename: filename, title: '歌詞簿歌曲資料 (data.json)' });
                        this.showToast('data.json 已匯出', 'success');
                    } else {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a'); a.href = url; a.download = filename;
                        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
                        this.showToast('data.json 已下載', 'success');
                    }
                } catch (e) { console.error('exportDataJson error:', e); this.showToast('匯出失敗：' + e.message, 'error'); }
            }

            handleFullImport(jsonStr) {
                try {
                    const data = JSON.parse(jsonStr);
                    if (!data.categories || !Array.isArray(data.categories)) throw new Error('缺少 categories 資料');
                    if (!data.songs || !Array.isArray(data.songs)) throw new Error('缺少 songs 料');
                    this.categories = data.categories; this.songs = data.songs;
                    this.bookmarks = (data.bookmarks && Array.isArray(data.bookmarks)) ? data.bookmarks : [];
                    if (data.settings && typeof data.settings === 'object') { this.settings.fontSize = data.settings.fontSize || this.settings.fontSize; this.settings.theme = data.settings.theme || this.settings.theme; }
                    this.songOrders = (data.songOrders && typeof data.songOrders === 'object') ? data.songOrders : {};
                    this.bookmarkOrder = (data.bookmarkOrder && Array.isArray(data.bookmarkOrder)) ? data.bookmarkOrder : [];
                    this.pinnedItems = (data.pinnedItems && typeof data.pinnedItems === 'object') ? data.pinnedItems : {};
                    this.highlights = (data.highlights && typeof data.highlights === 'object') ? data.highlights : {};
                    this.colorMeanings = (data.colorMeanings && Array.isArray(data.colorMeanings) && data.colorMeanings.length === HIGHLIGHT_COLORS.length) ? data.colorMeanings : [...DEFAULT_COLOR_MEANINGS];
                    this.ensureSubcategoriesCompat();
                    this.saveCategories(); this.saveSongs(); this.saveBookmarks(); this.saveSettings();
                    this.saveSongOrders(); this.saveBookmarkOrder(); this.savePinnedItems();
                    this.saveHighlights(); this.saveColorMeanings();
                    this.applySettings(); this.customSelectedCat = '';
                    this.hideModal(); this.showToast('資料匯入成功', 'success'); this.switchView('catalog');
                } catch (e) { console.error('fullImport error:', e); this.showToast('匯入失敗：' + e.message, 'error'); }
            }

            handleBatchImport(jsonStr) {
                try {
                    let songList = JSON.parse(jsonStr);
                    if (!Array.isArray(songList)) {
                        if (typeof songList === 'object' && songList.title) songList = [songList];
                        else throw new Error('資料格式錯誤：需要 JSON 陣列');
                    }
                    if (songList.length === 0) throw new Error('歌曲陣列為空');
                    const validSongs = [];
                    const errors = [];
                    songList.forEach((s, idx) => {
                        if (!s.category || !s.title) { errors.push(`第 ${idx + 1} 首：缺少 category 或 title`); return; }
                        const catExists = this.categories.find(c => c.key === s.category);
                        if (!catExists) { errors.push(`第 ${idx + 1} 首「${s.title || '?'}」：分類 "${s.category}" 不存在`); return; }
                        const key = this.songKey(s);
                        const duplicate = this.songs.find(existing => this.songKey(existing) === key);
                        if (duplicate) { errors.push(`第 ${idx + 1} 首「${s.title}」：已存在`); return; }
                        validSongs.push({ category: s.category, title: s.title, sub: s.sub || '', subcategory: s.subcategory || '', lyrics: s.lyrics || '' });
                    });
                    if (validSongs.length === 0) { this.showToast('無有效歌曲可匯入', 'error'); console.warn('批量匯入錯誤：', errors); return; }
                    validSongs.forEach(song => {
                        this.songs.push(song);
                        if (song.subcategory) { const cat = this.categories.find(c => c.key === song.category); if (cat && cat.subcategories && !cat.subcategories.includes(song.subcategory)) cat.subcategories.push(song.subcategory); }
                        const newKey = this.songKey(song);
                        const catObj = this.categories.find(c => c.key === song.category);
                        if (catObj) { const filters = ['所有', ...(catObj.subcategories || [])]; filters.forEach(f => { const ok = song.category + '_' + f; if (!this.songOrders[ok]) this.songOrders[ok] = []; this.songOrders[ok].unshift(newKey); }); }
                    });
                    this.saveSongs(); this.saveCategories(); this.saveSongOrders();
                    this.hideModal();
                    if (errors.length > 0) console.warn('批量匯入部分失敗：', errors);
                    this.showToast(`已匯入 ${validSongs.length} 首歌曲`, 'success');
                    this.switchView('catalog');
                } catch (e) { console.error('batchImport error:', e); this.showToast('匯入失敗：' + e.message, 'error'); }
            }

            confirmClearData() {
                const bodyHtml = '<div class="confirm-text">確定要清除所有資料嗎？<br>此操作將恢復為預設資料，無法復原。</div>';
                const footerHtml = `<button class="modal-btn cancel" id="modalCancelBtn">取消</button><button class="modal-btn danger" id="modalConfirmBtn">清除</button>`;
                this.showModal('確認清除', bodyHtml, footerHtml);
                document.getElementById('modalCancelBtn').addEventListener('click', () => app.hideModal());
                document.getElementById('modalConfirmBtn').addEventListener('click', async () => {
                    try {
                        app.categories = DEFAULT_CATEGORIES.map(c => ({ ...c, subcategories: [...(c.subcategories || [])] }));
                        app.songs = DEFAULT_SONGS.map(s => ({ ...s }));
                        app.bookmarks = []; app.settings = { ...DEFAULT_SETTINGS };
                        app.songOrders = {}; app.bookmarkOrder = []; app.pinnedItems = {};
                        app.highlights = {}; app.colorMeanings = [...DEFAULT_COLOR_MEANINGS];
                        app.customSelectedCat = '';
                        await app.saveCategories(); await app.saveSongs(); await app.saveBookmarks();
                        await app.saveSettings(); await app.saveSongOrders(); await app.saveBookmarkOrder();
                        await app.savePinnedItems(); await app.saveHighlights(); await app.saveColorMeanings();
                        app.applySettings(); app.hideModal();
                        app.showToast('資料已清除並恢復預設', 'success'); app.switchView('catalog');
                    } catch (e) { console.error('clearData error:', e); app.showToast('操作失敗', 'error'); }
                });
            }

            /* ============================================================
               模態彈窗系統
               ============================================================ */
            showModal(title, bodyHtml, footerHtml) {
                document.getElementById('modalTitle').textContent = title;
                document.getElementById('modalBody').innerHTML = bodyHtml;
                document.getElementById('modalFooter').innerHTML = footerHtml;
                document.getElementById('modalOverlay').classList.remove('hidden');
            }

            hideModal() {
                document.getElementById('modalOverlay').classList.add('hidden');
            }

            /* ============================================================
               Toast 提示
               ============================================================ */
            showToast(message, type) {
                type = type || 'info';
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = 'toast ' + type;
                toast.textContent = message;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.classList.add('out');
                    setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 200);
                }, 2000);
            }
        }

        /* ============================================================
           啟動應用
           ============================================================ */
        const app = new App();

        document.addEventListener('DOMContentLoaded', () => {
            const initTimeout = setTimeout(() => {
                console.warn('DOMContentLoaded timeout, forcing init');
                app.init().catch(e => console.error('App init error (timeout):', e));
            }, 3000);
            app.init().then(() => {
                clearTimeout(initTimeout);
            }).catch(e => {
                clearTimeout(initTimeout);
                console.error('App init error:', e);
            });
        });
    })();
    </script>
</body>
</html>
