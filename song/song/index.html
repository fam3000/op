                <div class="modal-footer" id="modalFooter"></div>
            </div>
        </div>
        <div id="toastContainer"></div>
    </div>

    <script>
    (() => {
        'use strict';

        /* ============================================================
           預設資料 & 常量
           ============================================================ */
        const DEFAULT_CATEGORIES = [
            { key: 'zh', label: '中文', subcategories: ['抒情', '流行'] },
            { key: 'en', label: '英文', subcategories: ['Classic', 'Pop', 'Rock'] },
            { key: 'cantonese', label: '粵語', subcategories: ['搖滾', '抒情'] },
            { key: 'kr', label: '韓語', subcategories: ['Dance', 'Pop'] },
            { key: 'bgm', label: 'BGM', subcategories: ['鋼琴'] },
            { key: 'kids', label: '兒歌', subcategories: ['童謠'] }
        ];

        const DEFAULT_SONGS = [
            { category: 'zh', title: '十年', sub: '陳奕迅', subcategory: '抒情', lyrics: '如果那兩個字沒有顫抖\n我不會發現 我難受\n怎麼說出口 也不過是分手\n如果對於明天沒有要求\n牽牽手就像旅遊\n成千上萬個門口\n總有一個人要先走\n\n懷抱既然不能逗留\n何不在離開的時候\n一邊享受 一邊淚流\n十年之前\n我不認識你 你不屬於我\n我們還是一樣\n陪在一個陌生人左右\n走過漸漸熟悉的街頭\n十年之後\n我們是朋友 還可以問候\n只是那種溫柔\n再也找不到擁抱的理由\n情人最後難免淪為朋友' },
            { category: 'zh', title: '光年之外', sub: '鄧紫棋', subcategory: '流行', lyrics: '感受停在我髮端的指尖\n如何瞬間 凍結時間\n記住望著我堅定的雙眼\n也許已經 沒有明天\n\n面對浩瀚的星海\n我們微小得像塵埃\n漂浮在一片無奈\n緣分讓我們相遇亂世以外\n命運卻要我們危難中相愛\n也許未來遙遠在光年之外\n我願守候未知裡為你等待' },
            { category: 'zh', title: '小幸運', sub: '田馥甄', subcategory: '抒情', lyrics: '我聽見雨滴落在青青草地\n我聽見遠方下課鐘聲響起\n可是我沒有聽見你的聲音\n認真 呼喚我姓名\n\n愛上你的時候還不懂感情\n離別了才覺得刻骨銘心\n為什麼沒有發現遇見了你\n是生命最好的事情\n\n也許當時忙著微笑和哭泣\n忙著追逐天空中的流星\n人理所當然的忘記\n是誰風裡雨裡一直默默守護在原地\n\n原來你是我想留住的幸運\n原來我們和愛情曾經靠得那麼近' },
            { category: 'zh', title: '告白氣球', sub: '周杰倫', subcategory: '流行', lyrics: '塞納河畔 左岸的咖啡\n我手一杯 品嚐你的美\n留下唇印的嘴\n花店玫瑰 名字寫錯誰\n告白氣球 風吹到對街\n微笑在天上飛\n\n你說你有點難追 想讓我知難而退\n禮物不需挑最貴 只要香榭的落葉\n喔～營造浪漫的約會 不害怕搞砸一切\n擁有你就擁有 全世界' },
            { category: 'zh', title: '演員', sub: '薛之謙', subcategory: '抒情', lyrics: '簡單點 說話的方式簡單點\n遞進的情緒請省略\n你又不是個演員\n別設計那些情節\n\n沒意見 我只想看看你怎麼圓\n你難過的太表面 像沒天賦的演員\n觀眾一眼能看見\n該配合你演出的我演視而不見\n在逼一個最愛你的人即興表演\n什麼時候我們開始收起了底線\n順應時代的改變 看那些拙劣的表演' },
            { category: 'en', title: 'Yesterday', sub: 'The Beatles', subcategory: 'Classic', lyrics: 'Yesterday all my troubles seemed so far away\nNow it looks as though they\'re here to stay\nOh I believe in yesterday\n\nSuddenly I\'m not half the man I used to be\nThere\'s a shadow hanging over me\nOh yesterday came suddenly\n\nWhy she had to go I don\'t know she wouldn\'t say\nI said something wrong now I long for yesterday' },
            { category: 'en', title: 'Shape of You', sub: 'Ed Sheeran', subcategory: 'Pop', lyrics: 'The club isn\'t the best place to find a lover\nSo the bar is where I go\nMe and my friends at the table doing shots\nDrinking fast and then we talk slow\nCome over and start up a conversation with just me\nAnd trust me I\'ll give it a chance now\nTake my hand, stop, put Van the man on the jukebox\nAnd then we start to dance, and now I\'m singing like' },
            { category: 'en', title: 'Bohemian Rhapsody', sub: 'Queen', subcategory: 'Rock', lyrics: 'Is this the real life? Is this just fantasy?\nCaught in a landslide, no escape from reality\nOpen your eyes, look up to the skies and see\nI\'m just a poor boy, I need no sympathy\nBecause I\'m easy come, easy go, little high, little low\nAny way the wind blows doesn\'t really matter to me, to me' },
            { category: 'cantonese', title: '海闊天空', sub: 'Beyond', subcategory: '搖滾', lyrics: '今天我 寒夜裡看雪飄過\n懷著冷卻了的心窩飄遠方\n風雨裡追趕 霧裡分不清影蹤\n天空海闊你與我 可會變 (誰沒在變)\n\n多少次 迎著冷眼與嘲笑\n從沒有放棄過心中的理想\n一剎那恍惚 若有所失的感覺\n不知不覺已變淡 心裡愛 (誰明白我)\n\n原諒我這一生不羈放縱愛自由\n也會怕有一天會跌倒\n背棄了理想 誰人都可以\n那會怕有一天只你共我' },
            { category: 'cantonese', title: '富士山下', sub: '陳奕迅', subcategory: '抒情', lyrics: '攔路雨偏似雪花 飲泣的你凍嗎\n這風褸我給你磨到有襟花\n連調了職也不怕 怎麼始終牽掛\n苦心選中今天想車你回家\n\n原諒我不再送花 傷口應要結疤\n花瓣鋪滿心裡墳場才害怕\n如若你非我不嫁 彼此終必火化\n一生一世等一天需要代價\n\n誰都只得那雙手 靠擁抱亦難任你擁有\n要擁有必先懂失去怎接受\n曾沿著雪路浪遊 為何為好事淚流\n誰能憑愛意要富士山私有' },
            { category: 'kr', title: 'Gangnam Style', sub: 'PSY', subcategory: 'Dance', lyrics: 'Oppan Gangnam style\nGangnam style\nAyy, sexy lady\nOppan Gangnam style\n\nEh-oh, eh-oh, eh-oh, eh-oh\nEh-oh, eh-oh, eh-oh, eh-oh\nAyy, sexy lady\nOppan Gangnam style' },
            { category: 'kr', title: 'Dynamite', sub: 'BTS', subcategory: 'Pop', lyrics: 'Cause I-I-I\'m in the stars tonight\nSo watch me bring the fire and set the night alight\nShoes on, get up in the morn\nCup of milk, let\'s rock and roll\nKing Kong, kick the drum, rolling on like a rolling stone\nSing song when I\'m walking home\nJump up to the top, LeBron\nDing dong, call me on my phone\nIce tea and a game of ping pong' },
            { category: 'bgm', title: 'River Flows in You', sub: 'Yiruma', subcategory: '鋼琴', lyrics: '(純音樂，無歌詞)' },
            { category: 'bgm', title: 'Summer', sub: '久石讓', subcategory: '鋼琴', lyrics: '(純音樂，無歌詞)' },
            { category: 'kids', title: '小星星', sub: '傳統兒歌', subcategory: '童謠', lyrics: '一閃一閃亮晶晶\n滿天都是小星星\n掛在天上放光明\n好像許多小眼睛\n\n一閃一閃亮晶晶\n滿天都是小星星' },
            { category: 'kids', title: '兩隻老虎', sub: '傳統兒歌', subcategory: '童謠', lyrics: '兩隻老虎 兩隻老虎\n跑得快 跑得快\n一隻沒有眼睛 一隻沒有尾巴\n真奇怪 奇怪' }
        ];

        const DEFAULT_SETTINGS = { fontSize: 'medium', theme: 'light' };

        /* 螢光筆顏色定義 */
        const HIGHLIGHT_COLORS = [
            { dot: '#FFEB3B', name: '黃色' },
            { dot: '#A5D6A7', name: '綠色' },
            { dot: '#90CAF9', name: '藍色' },
            { dot: '#F48FB1', name: '粉色' },
            { dot: '#FFCC80', name: '橙色' }
        ];

        /* 預設顏色含義 */
        const DEFAULT_COLOR_MEANINGS = ['重點', '喜歡', '待練習', '情感', '注意'];

        /* data.json 路徑 */
        const DATA_JSON_PATH = './data.json';

        /* ============================================================
           應用類
           ============================================================ */
        class App {
            constructor() {
                this.categories = [];
                this.songs = [];
                this.bookmarks = [];
                this.settings = { ...DEFAULT_SETTINGS };
                this.songOrders = {};
                this.bookmarkOrder = [];
                this.pinnedItems = {};
                this.currentView = 'catalog';
                this.currentCategory = null;
                this.currentFilterTag = '所有';
                this.previousView = 'catalog';
                this.customSelectedCat = '';
                this.customSubcatExpanded = false;
                this.customSongsExpanded = false;
                this.dragState = null;
                this.wasDragging = false;
                this.importMode = 'full';
                this.dataJsonLoaded = false;
                /* 搜索 */
                this.catalogSearchQuery = '';
                /* 螢光筆 */
                this.highlights = {};
                this.colorMeanings = [...DEFAULT_COLOR_MEANINGS];
                this.currentSongKey = '';
                this.currentSongLyrics = '';
                this.selectedHlColor = 0;
                this.eraserMode = false;
                this.hasTextSelection = false;
                /* 預存選取偏移量（解決行動端按鈕點擊時選取丟失問題） */
                this.savedSelection = null;
            }

            /* ----- 工具函數 ----- */
            songKey(song) {
                return `${song.category || 'zh'}:${song.title || ''}:${song.sub || ''}`;
            }

            escapeHtml(str) {
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            generateCatKey() {
                return 'cat_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6);
            }

            isWusiStorageAvailable() {
                return (typeof wusiStorage !== 'undefined' && typeof wusiStorage.getItem === 'function' && typeof wusiStorage.setItem === 'function');
            }

            getFetchFunc() {
                return (typeof wusiFetch === 'function') ? wusiFetch : fetch;
            }

            async loadWithRetry(key, maxRetries) {
                if (!this.isWusiStorageAvailable()) return null;
                maxRetries = maxRetries || 3;
                try {
                    const data = wusiStorage.getItem(key);
                    if (data !== null && data !== undefined) return data;
                } catch (e) {
                    console.warn('loadWithRetry first try error:', key, e);
                }
                const delays = [100, 200];
                for (let i = 0; i < Math.min(maxRetries - 1, delays.length); i++) {
                    await new Promise(r => setTimeout(r, delays[i]));
                    try {
                        const data = wusiStorage.getItem(key);
                        if (data !== null && data !== undefined) return data;
                    } catch (e) {
                        console.warn('loadWithRetry retry error:', key, e);
                    }
                }
                return null;
            }

            ensureSubcategoriesCompat() {
                this.categories.forEach(cat => {
                    if (!cat.subcategories || !Array.isArray(cat.subcategories)) {
                        cat.subcategories = [];
                    }
                    this.songs.filter(s => s.category === cat.key && s.subcategory).forEach(s => {
                        if (!cat.subcategories.includes(s.subcategory)) {
                            cat.subcategories.push(s.subcategory);
                        }
                    });
                });
            }

            /* ============================================================
               初始化
               ============================================================ */
            async init() {
                /* Phase 1：用預設資料立即渲染 */
                this.categories = DEFAULT_CATEGORIES.map(c => ({ ...c, subcategories: [...(c.subcategories || [])] }));
                this.songs = DEFAULT_SONGS.map(s => ({ ...s }));
                this.bookmarks = [];
                this.settings = { ...DEFAULT_SETTINGS };
                this.songOrders = {};
                this.bookmarkOrder = [];
                this.pinnedItems = {};
                this.highlights = {};
                this.colorMeanings = [...DEFAULT_COLOR_MEANINGS];

                /* Phase 1.5：嘗試載入 data.json */
                try {
                    const fetchFunc = this.getFetchFunc();
                    const resp = await fetchFunc(DATA_JSON_PATH);
                    if (resp.ok) {
                        const jsonData = await resp.json();
                        if (jsonData.categories && Array.isArray(jsonData.categories) && jsonData.categories.length > 0) {
                            this.categories = jsonData.categories.map(c => ({ ...c, subcategories: c.subcategories ? [...c.subcategories] : [] }));
                            this.dataJsonLoaded = true;
                        }
                        if (jsonData.songs && Array.isArray(jsonData.songs) && jsonData.songs.length > 0) {
                            this.songs = jsonData.songs.map(s => ({ ...s }));
                            this.dataJsonLoaded = true;
                        }
                        console.log('data.json loaded, songs:', this.songs.length);
                    }
                } catch (e) {
                    console.log('data.json not available:', e.message);
                }

                this.ensureSubcategoriesCompat();
                this.applySettings();
                this.bindEvents();
                this.switchView('catalog');

                /* Phase 2：背景載入 wusiStorage */
                await this.loadWusiStorageData();

                this.ensureSubcategoriesCompat();
                this.applySettings();
                this.refreshCurrentView();
            }

            async loadWusiStorageData() {
                if (!this.isWusiStorageAvailable()) {
                    console.log('wusiStorage not available');
                    return;
                }
                try {
                    const [catData, songData, bmData, setData, orderData, bmOrderData, pinData, hlData, cmData] = await Promise.all([
                        this.loadWithRetry('lyrics_categories'),
                        this.loadWithRetry('lyrics_songs'),
                        this.loadWithRetry('lyrics_bookmarks'),
                        this.loadWithRetry('lyrics_settings'),
                        this.loadWithRetry('lyrics_songOrders'),
                        this.loadWithRetry('lyrics_bookmarkOrder'),
                        this.loadWithRetry('lyrics_pinnedItems'),
                        this.loadWithRetry('lyrics_highlights'),
                        this.loadWithRetry('lyrics_colorMeanings')
                    ]);

                    if (catData && Array.isArray(catData) && catData.length > 0) this.categories = catData;
                    if (songData && Array.isArray(songData) && songData.length > 0) this.songs = songData;
                    this.bookmarks = (bmData && Array.isArray(bmData)) ? bmData : [];
                    if (setData && typeof setData === 'object') this.settings = { ...DEFAULT_SETTINGS, ...setData };
                    this.songOrders = (orderData && typeof orderData === 'object') ? orderData : {};
                    this.bookmarkOrder = (bmOrderData && Array.isArray(bmOrderData)) ? bmOrderData : [];
                    this.pinnedItems = (pinData && typeof pinData === 'object') ? pinData : {};
                    this.highlights = (hlData && typeof hlData === 'object') ? hlData : {};
                    this.colorMeanings = (cmData && Array.isArray(cmData) && cmData.length === HIGHLIGHT_COLORS.length) ? cmData : [...DEFAULT_COLOR_MEANINGS];

                    if (!catData) await wusiStorage.setItem('lyrics_categories', this.categories);
                    if (!songData) await wusiStorage.setItem('lyrics_songs', this.songs);
                    if (!bmData) await wusiStorage.setItem('lyrics_bookmarks', this.bookmarks);
                    if (!setData) await wusiStorage.setItem('lyrics_settings', this.settings);
                    if (!orderData) await wusiStorage.setItem('lyrics_songOrders', this.songOrders);
                    if (!bmOrderData) await wusiStorage.setItem('lyrics_bookmarkOrder', this.bookmarkOrder);
                    if (!pinData) await wusiStorage.setItem('lyrics_pinnedItems', this.pinnedItems);
                    if (!hlData) await wusiStorage.setItem('lyrics_highlights', this.highlights);
                    if (!cmData) await wusiStorage.setItem('lyrics_colorMeanings', this.colorMeanings);

                    console.log('wusiStorage loaded, songs:', this.songs.length);
                } catch (e) {
                    console.error('loadWusiStorageData error:', e);
                }
            }

            refreshCurrentView() {
                switch (this.currentView) {
                    case 'catalog': this.renderCatalog(); break;
                    case 'category': this.renderCategory(); break;
                    case 'bookmark': this.renderBookmarks(); break;
                    case 'custom': this.renderCustom(); break;
                    case 'settings': this.renderSettings(); break;
                    case 'lyricsDetail': break;
                }
            }

            /* ----- 資料儲存 ----- */
            async saveCategories() { if (!this.isWusiStorageAvailable()) return; try { await wusiStorage.setItem('lyrics_categories', this.categories); } catch (e) { console.error('saveCategories error:', e); } }
            async saveSongs() { if (!this.isWusiStorageAvailable()) return; try { await wusiStorage.setItem('lyrics_songs', this.songs); } catch (e) { console.error('saveSongs error:', e); } }
            async saveBookmarks() { if (!this.isWusiStorageAvailable()) return; try { await wusiStorage.setItem('lyrics_bookmarks', this.bookmarks); } catch (e) { console.error('saveBookmarks error:', e); } }
            async saveSettings() { if (!this.isWusiStorageAvailable()) return; try { await wusiStorage.setItem('lyrics_settings', this.settings); } catch (e) { console.error('saveSettings error:', e); } }
            async saveSongOrders() { if (!this.isWusiStorageAvailable()) return; try { await wusiStorage.setItem('lyrics_songOrders', this.songOrders); } catch (e) { console.error('saveSongOrders error:', e); } }
            async saveBookmarkOrder() { if (!this.isWusiStorageAvailable()) return; try { await wusiStorage.setItem('lyrics_bookmarkOrder', this.bookmarkOrder); } catch (e) { console.error('saveBookmarkOrder error:', e); } }
            async savePinnedItems() { if (!this.isWusiStorageAvailable()) return; try { await wusiStorage.setItem('lyrics_pinnedItems', this.pinnedItems); } catch (e) { console.error('savePinnedItems error:', e); } }
            async saveHighlights() { if (!this.isWusiStorageAvailable()) return; try { await wusiStorage.setItem('lyrics_highlights', this.highlights); } catch (e) { console.error('saveHighlights error:', e); } }
            async saveColorMeanings() { if (!this.isWusiStorageAvailable()) return; try { await wusiStorage.setItem('lyrics_colorMeanings', this.colorMeanings); } catch (e) { console.error('saveColorMeanings error:', e); } }

            applySettings() {
                const sizeMap = { small: '14px', medium: '16px', large: '18px' };
                document.documentElement.style.setProperty('--lyrics-font-size', sizeMap[this.settings.fontSize] || '16px');
                if (this.settings.theme === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }

            /* ============================================================
               事件綁定
               ============================================================ */
            bindEvents() {
                /* 底部導航 */
                document.querySelectorAll('#bottomNav .nav-tab').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const view = this.dataset.view;
                        if (view) app.switchView(view);
                    });
                });

                /* 返回按鈕 */
                document.getElementById('navBackBtn').addEventListener('click', () => {
                    app.handleBack();
                });

                /* 模態彈窗關閉 */
                document.getElementById('modalCloseBtn').addEventListener('click', () => {
                    app.hideModal();
                });
                document.getElementById('modalOverlay').addEventListener('click', (e) => {
                    if (e.target === document.getElementById('modalOverlay')) {
                        app.hideModal();
                    }
                });

                /* 搜索框事件 */
                const searchInput = document.getElementById('catalogSearchInput');
                const searchClear = document.getElementById('searchClearBtn');

                searchInput.addEventListener('input', function() {
                    app.catalogSearchQuery = this.value.trim();
                    searchClear.classList.toggle('visible', app.catalogSearchQuery.length > 0);
                    app.renderCatalog();
                });

                searchClear.addEventListener('click', () => {
                    searchInput.value = '';
                    app.catalogSearchQuery = '';
                    searchClear.classList.remove('visible');
                    app.renderCatalog();
                    searchInput.focus();
                });

                /* 螢光筆：監聽文字選取變化，預存偏移量 */
                document.addEventListener('selectionchange', () => {
                    if (app.currentView !== 'lyricsDetail') return;
                    const sel = window.getSelection();
                    const lyricsEl = document.getElementById('lyricsContentEl');
                    if (!lyricsEl) return;

                    /* 有有效選取時，計算並預存偏移量 */
                    if (sel && sel.toString().trim().length > 0 && lyricsEl.contains(sel.anchorNode)) {
                        try {
                            const range = sel.getRangeAt(0);
                            const startOff = app.getTextOffset(lyricsEl, range.startContainer, range.startOffset);
                            const endOff = app.getTextOffset(lyricsEl, range.endContainer, range.endOffset);
                            if (startOff >= 0 && endOff > startOff) {
                                app.savedSelection = { start: startOff, end: endOff };
                                app.hasTextSelection = true;
                            }
                        } catch (e) {
                            console.warn('selectionchange save error:', e);
                        }
                    } else {
                        /* 選取被清除時，不立即清除預存數據（行動端按鈕點擊會先清除選取） */
                        app.hasTextSelection = false;
                    }
                    app.updateHlMarkBtn();
                });
            }

            /* ============================================================
               視圖切換
               ============================================================ */
            switchView(viewName, params) {
                /* 離開歌詞頁時清除預存選取 */
                if (this.currentView === 'lyricsDetail' && viewName !== 'lyricsDetail') {
                    this.savedSelection = null;
                    this.hasTextSelection = false;
                }

                this.previousView = this.currentView;
                this.currentView = viewName;

                /* 切換視圖顯示 */
                document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
                const viewEl = document.getElementById('view' + viewName.charAt(0).toUpperCase() + viewName.slice(1));
                if (viewEl) viewEl.classList.add('active');

                /* 更新導航標題 */
                const titleMap = {
                    catalog: '目錄',
                    category: (params && params.label) || '分類',
                    bookmark: '書籤',
                    custom: '自訂',
                    settings: '設定',
                    lyricsDetail: '歌詞'
                };
                document.getElementById('navTitle').textContent = titleMap[viewName] || '歌詞簿';

                /* 返回按鈕顯示 */
                const backBtn = document.getElementById('navBackBtn');
                backBtn.style.display = (viewName === 'category' || viewName === 'lyricsDetail') ? 'flex' : 'none';

                /* 底部導航顯示/隱藏 */
                const bottomNav = document.getElementById('bottomNav');
                bottomNav.classList.toggle('hidden', viewName === 'lyricsDetail');

                /* 底部導航 Tab 高亮 */
                const tabMap = { catalog: 0, bookmark: 1, custom: 2, settings: 3 };
                document.querySelectorAll('#bottomNav .nav-tab').forEach((btn, i) => {
                    btn.classList.toggle('active', i === (tabMap[viewName] !== undefined ? tabMap[viewName] : -1));
                });

                /* 渲染各視圖 */
                switch (viewName) {
                    case 'catalog':
                        this.renderCatalog();
                        break;
                    case 'category':
                        if (params) {
                            this.currentCategory = { key: params.cat, label: params.label };
                            this.currentFilterTag = '所有';
                        }
                        this.renderCategory();
                        break;
                    case 'bookmark':
                        this.renderBookmarks();
                        break;
                    case 'custom':
                        this.renderCustom();
                        break;
                    case 'settings':
                        this.renderSettings();
                        break;
                    case 'lyricsDetail':
                        break;
                }
            }

            handleBack() {
                /* 清除預存選取 */
                this.savedSelection = null;
                this.hasTextSelection = false;

                if (this.currentView === 'lyricsDetail') {
                    if (this.previousView === 'category' && this.currentCategory) {
                        this.switchView('category', { cat: this.currentCategory.key, label: this.currentCategory.label });
                    } else if (this.previousView === 'bookmark') {
                        this.switchView('bookmark');
                    } else {
                        this.switchView('catalog');
                    }
                } else if (this.currentView === 'category') {
                    this.switchView('catalog');
                }
            }

            /* ============================================================
               排序與置頂
               ============================================================ */
            getOrderedSongs(songs, orderKey) {
                const order = this.songOrders[orderKey] || [];
                const pinned = this.pinnedItems[orderKey] || [];
                const pinnedSongs = [];
                const unpinnedSongs = [];
                const seenKeys = new Set();

                pinned.forEach(key => {
                    const song = songs.find(s => this.songKey(s) === key);
                    if (song) { pinnedSongs.push(song); seenKeys.add(key); }
                });
                order.forEach(key => {
                    if (pinned.includes(key)) return;
                    const song = songs.find(s => this.songKey(s) === key);
                    if (song) { unpinnedSongs.push(song); seenKeys.add(key); }
                });
                songs.forEach(song => {
                    const key = this.songKey(song);
                    if (!seenKeys.has(key)) { unpinnedSongs.push(song); }
                });
                return [...pinnedSongs, ...unpinnedSongs];
            }

            updateOrder(orderKey, newKeyOrder) { this.songOrders[orderKey] = newKeyOrder; this.saveSongOrders(); }
            updateBookmarkOrder(newKeyOrder) { this.bookmarkOrder = newKeyOrder; this.saveBookmarkOrder(); }

            pinSong(orderKey, songKey) {
                if (!this.pinnedItems[orderKey]) this.pinnedItems[orderKey] = [];
                if (!this.pinnedItems[orderKey].includes(songKey)) {
                    this.pinnedItems[orderKey].unshift(songKey);
                    this.savePinnedItems();
                }
            }

            unpinSong(orderKey, songKey) {
                if (this.pinnedItems[orderKey]) {
                    this.pinnedItems[orderKey] = this.pinnedItems[orderKey].filter(k => k !== songKey);
                    if (this.pinnedItems[orderKey].length === 0) delete this.pinnedItems[orderKey];
                    this.savePinnedItems();
                }
            }

            isPinned(orderKey, songKey) {
                return (this.pinnedItems[orderKey] || []).includes(songKey);
            }

            cleanupOrderData(deletedKey) {
                Object.keys(this.songOrders).forEach(ok => {
                    this.songOrders[ok] = this.songOrders[ok].filter(k => k !== deletedKey);
                    if (this.songOrders[ok].length === 0) delete this.songOrders[ok];
                });
                this.bookmarkOrder = this.bookmarkOrder.filter(k => k !== deletedKey);
                Object.keys(this.pinnedItems).forEach(ok => {
                    this.pinnedItems[ok] = this.pinnedItems[ok].filter(k => k !== deletedKey);
                    if (this.pinnedItems[ok].length === 0) delete this.pinnedItems[ok];
                });
                this.saveSongOrders();
                this.saveBookmarkOrder();
                this.savePinnedItems();
            }

            cleanupCategoryOrderData(catKey) {
                Object.keys(this.songOrders).forEach(ok => { if (ok.startsWith(catKey + '_')) delete this.songOrders[ok]; });
                Object.keys(this.pinnedItems).forEach(ok => { if (ok.startsWith(catKey + '_')) delete this.pinnedItems[ok]; });
                this.saveSongOrders();
                this.savePinnedItems();
            }

            /* ============================================================
               渲染：目錄（含搜索）
               ============================================================ */
            renderCatalog() {
                const container = document.getElementById('catalogList');
                if (!container) return;

                const q = this.catalogSearchQuery.toLowerCase();

                if (q) {
                    /* 搜索模式：顯示匹配的歌曲 */
                    const results = this.songs.filter(s => {
                        const title = (s.title || '').toLowerCase();
                        const sub = (s.sub || '').toLowerCase();
                        return title.includes(q) || sub.includes(q);
                    });

                    if (!results.length) {
                        container.innerHTML = '<div class="list-empty">沒有找到匹配的歌曲</div>';
                        return;
                    }

                    container.innerHTML = results.map(s => {
                        const key = this.songKey(s);
                        const catLabel = this.getCatLabel(s.category);
                        const on = this.bookmarks.includes(key);
                        return `<div class="search-result-item" data-song="${this.escapeHtml(key)}">
                            <span class="search-result-cat">${this.escapeHtml(catLabel)}</span>
                            <span class="item-title">${this.escapeHtml(s.title)}<span class="sub">${this.escapeHtml(s.sub || '')}</span></span>
                            <button class="bookmark-btn ${on ? 'active' : ''}" data-bookmark-id="${this.escapeHtml(key)}">${on ? '★' : '☆'}</button>
                        </div>`;
                    }).join('');

                    container.querySelectorAll('[data-bookmark-id]').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            app.toggleBookmark(btn.dataset.bookmarkId);
                            app.renderCatalog();
                        });
                    });

                    container.querySelectorAll('[data-song]').forEach(el => {
                        el.addEventListener('click', (e) => {
                            if (e.target.closest('.bookmark-btn')) return;
                            const key = el.dataset.song;
                            const song = app.songs.find(s => app.songKey(s) === key);
                            if (song) app.showLyricsDetail(song);
                        });
                    });
                } else {
                    /* 正常模式：顯示分類列表 */
                    if (!this.categories.length) {
                        container.innerHTML = '<div class="list-empty">尚無分類<br>請至「自訂」新增分類</div>';
                        return;
                    }

                    container.innerHTML = this.categories.map(c => {
                        const count = this.songs.filter(s => s.category === c.key).length;
                        return `<div class="list-item" data-cat="${this.escapeHtml(c.key)}" data-label="${this.escapeHtml(c.label)}">
                            <span class="item-number">▸</span>
                            <span class="item-title">${this.escapeHtml(c.label)}<span class="sub">${count} 首歌曲</span></span>
                        </div>`;
                    }).join('');

                    container.querySelectorAll('[data-cat]').forEach(el => {
                        el.addEventListener('click', () => {
                            app.switchView('category', { cat: el.dataset.cat, label: el.dataset.label });
                        });
                    });
                }
            }

            /* ============================================================
               渲染：分類
               ============================================================ */
            renderCategory() {
                const catKey = this.currentCategory ? this.currentCategory.key : 'zh';
                const catLabel = this.currentCategory ? this.currentCategory.label : '分類';
                document.getElementById('navTitle').textContent = catLabel;

                const tagScroll = document.getElementById('tagScroll');
                if (tagScroll) {
                    const catObj = this.categories.find(c => c.key === catKey);
                    const managedSubcats = catObj ? (catObj.subcategories || []) : [];
                    const songSubcats = new Set();
                    this.songs.filter(s => s.category === catKey).forEach(s => {
                        if (s.subcategory) songSubcats.add(s.subcategory);
                    });
                    const allSubcats = [...managedSubcats];
                    songSubcats.forEach(sc => { if (!allSubcats.includes(sc)) allSubcats.push(sc); });
                    const tagList = ['所有', ...allSubcats];
                    tagScroll.innerHTML = tagList.map(t =>
                        `<button class="tag-item ${t === this.currentFilterTag ? 'active' : ''}" data-tag="${this.escapeHtml(t)}">${this.escapeHtml(t)}</button>`
                    ).join('');
                    tagScroll.querySelectorAll('.tag-item').forEach(btn => {
                        btn.addEventListener('click', function() {
                            app.currentFilterTag = this.dataset.tag;
                            tagScroll.querySelectorAll('.tag-item').forEach(b => b.classList.remove('active'));
                            this.classList.add('active');
                            app.renderSongList(catKey);
                        });
                    });
                }
                this.renderSongList(catKey);
            }

            renderSongList(catKey) {
                const list = document.getElementById('songList');
                if (!list) return;
                let items = this.songs.filter(s => s.category === catKey);
                if (this.currentFilterTag !== '所有') {
                    items = items.filter(s => s.subcategory === this.currentFilterTag);
                }
                const orderKey = catKey + '_' + this.currentFilterTag;
                items = this.getOrderedSongs(items, orderKey);
                if (!items.length) {
                    list.innerHTML = '<div class="list-empty">此分類下沒有歌曲</div>';
                    return;
                }
                list.innerHTML = items.map((s, idx) => this.songItemHtml(s, idx + 1, orderKey)).join('');
                this.bindSongItemEvents(list, orderKey);
            }

            /* ============================================================
               渲染：書籤
               ============================================================ */
            renderBookmarks() {
                const container = document.getElementById('bookmarkList');
                if (!container) return;
                let items = this.songs.filter(s => this.bookmarks.includes(this.songKey(s)));
                const orderKey = 'bookmarks';
                items = this.getOrderedSongs(items, orderKey);
                if (!items.length) {
                    container.innerHTML = '<div class="list-empty">尚未加入任何書籤</div>';
                    return;
                }
                container.innerHTML = items.map((s, idx) => this.songItemHtml(s, idx + 1, orderKey)).join('');
                this.bindSongItemEvents(container, orderKey);
            }

            /* ============================================================
               共用：歌曲列表 HTML 與事件
               ============================================================ */
            songItemHtml(song, num, orderKey) {
                const key = this.songKey(song);
                const on = this.bookmarks.includes(key);
                const pinned = this.isPinned(orderKey, key);
                const title = this.escapeHtml(song.title || '');
                const sub = song.sub ? `<span class="sub">${this.escapeHtml(song.sub)}</span>` : '';
                const pinnedClass = pinned ? ' pinned' : '';
                const pinBadge = pinned ? '<span class="pin-badge">置頂</span>' : '';
                return `<div class="list-item${pinnedClass}" data-song="${this.escapeHtml(key)}" data-order-key="${this.escapeHtml(orderKey)}">
                    ${pinBadge}<span class="item-number">${num}.</span>
                    <span class="item-title">${title}${sub}</span>
                    <button class="bookmark-btn ${on ? 'active' : ''}" data-bookmark-id="${this.escapeHtml(key)}">${on ? '★' : '☆'}</button>
                </div>`;
            }

            bindSongItemEvents(container, orderKey) {
                container.querySelectorAll('[data-bookmark-id]').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        app.toggleBookmark(btn.dataset.bookmarkId);
                        if (app.currentView === 'category') app.renderCategory();
                        else if (app.currentView === 'bookmark') app.renderBookmarks();
                    });
                });
                container.querySelectorAll('.list-item[data-song]').forEach(item => {
                    item.addEventListener('click', (e) => {
                        if (e.target.closest('.bookmark-btn')) return;
                        if (app.wasDragging) { app.wasDragging = false; return; }
                        const key = item.dataset.song;
                        const song = app.songs.find(s => app.songKey(s) === key);
                        if (song) app.showLyricsDetail(song);
                    });
                });
                this.setupDragReorder(container, orderKey);
            }

            /* ============================================================
               長按拖曳排序
               ============================================================ */
            setupDragReorder(container, orderKey) {
                const items = container.querySelectorAll('.list-item[data-song]');
                let longPressTimer = null;
                let touchStartY = 0;
                let touchStartX = 0;
                let isDragActive = false;
                let dragEl = null;
                let dragKey = '';
                let hasMoved = false;

                items.forEach(item => {
                    item.addEventListener('touchstart', (e) => {
                        touchStartY = e.touches[0].clientY;
                        touchStartX = e.touches[0].clientX;
                        hasMoved = false;
                        isDragActive = false;
                        dragEl = item;
                        dragKey = item.dataset.song;
                        longPressTimer = setTimeout(() => {
                            isDragActive = true;
                            item.classList.add('dragging');
                            if (navigator.vibrate) navigator.vibrate(25);
                        }, 600);
                    }, { passive: true });

                    item.addEventListener('touchmove', (e) => {
                        if (isDragActive && dragEl === item) {
                            e.preventDefault();
                            hasMoved = true;
                            const dy = e.touches[0].clientY - touchStartY;
                            item.style.transform = `translateY(${dy}px)`;
                            item.style.zIndex = '100';
                            const dragRect = item.getBoundingClientRect();
                            const dragCenter = dragRect.top + dragRect.height / 2;
                            const allItems = Array.from(container.querySelectorAll('.list-item[data-song]'));
                            const currentIdx = allItems.indexOf(item);
                            allItems.forEach((otherItem, idx) => {
                                if (otherItem === item) return;
                                const rect = otherItem.getBoundingClientRect();
                                const center = rect.top + rect.height / 2;
                                if (idx < currentIdx && dragCenter < center) {
                                    otherItem.style.transform = `translateY(${dragRect.height + 6}px)`;
                                } else if (idx > currentIdx && dragCenter > center) {
                                    otherItem.style.transform = `translateY(-${dragRect.height + 6}px)`;
                                } else {
                                    otherItem.style.transform = '';
                                }
                                otherItem.style.transition = 'transform 0.15s ease';
                            });
                        } else if (longPressTimer) {
                            const dy = Math.abs(e.touches[0].clientY - touchStartY);
                            const dx = Math.abs(e.touches[0].clientX - touchStartX);
                            if (dy > 10 || dx > 10) {
                                clearTimeout(longPressTimer);
                                longPressTimer = null;
                            }
                        }
                    }, { passive: false });

                    item.addEventListener('touchend', () => {
                        clearTimeout(longPressTimer);
                        longPressTimer = null;
                        if (!isDragActive || dragEl !== item) return;
                        if (!hasMoved) {
                            resetDragStyles();
                            isDragActive = false;
                            dragEl = null;
                            app.wasDragging = true;
                            setTimeout(() => { app.wasDragging = false; }, 300);
                            const song = app.songs.find(s => app.songKey(s) === dragKey);
                            if (song) app.showSortModal(song, orderKey);
                            return;
                        }
                        const allItems = Array.from(container.querySelectorAll('.list-item[data-song]'));
                        const itemsWithPos = allItems.map(el => ({ key: el.dataset.song, top: el.getBoundingClientRect().top }));
                        itemsWithPos.sort((a, b) => a.top - b.top);
                        const newKeyOrder = itemsWithPos.map(i => i.key);
                        resetDragStyles();
                        isDragActive = false;
                        dragEl = null;
                        app.wasDragging = true;
                        setTimeout(() => { app.wasDragging = false; }, 300);
                        if (orderKey === 'bookmarks') app.updateBookmarkOrder(newKeyOrder);
                        else app.updateOrder(orderKey, newKeyOrder);
                        if (app.currentView === 'category') app.renderSongList(app.currentCategory ? app.currentCategory.key : 'zh');
                        else if (app.currentView === 'bookmark') app.renderBookmarks();
                    });

                    item.addEventListener('touchcancel', () => {
                        clearTimeout(longPressTimer);
                        longPressTimer = null;
                        resetDragStyles();
                        isDragActive = false;
                        dragEl = null;
                    });
                });

                function resetDragStyles() {
                    container.querySelectorAll('.list-item[data-song]').forEach(el => {
                        el.classList.remove('dragging');
                        el.style.transform = '';
                        el.style.zIndex = '';
                        el.style.transition = '';
                    });
                }
            }

            /* ============================================================
               排序模態窗
               ============================================================ */
            showSortModal(song, orderKey) {
                const key = this.songKey(song);
                const pinned = this.isPinned(orderKey, key);
                let allKeys = [];
                if (orderKey === 'bookmarks') {
                    allKeys = this.getOrderedSongs(this.songs.filter(s => this.bookmarks.includes(this.songKey(s))), orderKey).map(s => this.songKey(s));
                } else {
                    const catKey = orderKey.split('_')[0];
                    const filterTag = orderKey.substring(catKey.length + 1);
                    let items = this.songs.filter(s => s.category === catKey);
                    if (filterTag !== '所有') items = items.filter(s => s.subcategory === filterTag);
                    allKeys = this.getOrderedSongs(items, orderKey).map(s => this.songKey(s));
                }
                const currentIdx = allKeys.indexOf(key);
                const bodyHtml = `
                    <div class="sort-song-info">
                        <div class="sort-song-title">${this.escapeHtml(song.title)}</div>
                        <div class="sort-song-sub">${this.escapeHtml(song.sub || '')}</div>
                    </div>
                    <div class="sort-actions">
                        <button class="sort-action-btn" id="sortMoveUp"><span class="sort-action-icon">↑</span> 上移</button>
                        <button class="sort-action-btn" id="sortMoveDown"><span class="sort-action-icon">↓</span> 下移</button>
                        ${pinned ? '<button class="sort-action-btn accent" id="sortUnpin"><span class="sort-action-icon">◉</span> 取消置頂</button>' : '<button class="sort-action-btn accent" id="sortPin"><span class="sort-action-icon">◉</span> 置頂</button>'}
                    </div>`;
                const footerHtml = `<button class="modal-btn confirm" id="modalCloseSortBtn">關閉</button>`;
                this.showModal('排序選項', bodyHtml, footerHtml);
                document.getElementById('modalCloseSortBtn').addEventListener('click', () => app.hideModal());
                const moveUpBtn = document.getElementById('sortMoveUp');
                if (moveUpBtn) moveUpBtn.addEventListener('click', () => {
                    if (currentIdx > 0) {
                        const newOrder = [...allKeys]; newOrder.splice(currentIdx, 1); newOrder.splice(currentIdx - 1, 0, key);
                        if (orderKey === 'bookmarks') app.updateBookmarkOrder(newOrder); else app.updateOrder(orderKey, newOrder);
                        app.hideModal(); app.refreshCurrentList(); app.showToast('已上移', 'success');
                    } else { app.showToast('已在最上方', 'info'); }
                });
                const moveDownBtn = document.getElementById('sortMoveDown');
                if (moveDownBtn) moveDownBtn.addEventListener('click', () => {
                    if (currentIdx < allKeys.length - 1) {
                        const newOrder = [...allKeys]; newOrder.splice(currentIdx, 1); newOrder.splice(currentIdx + 1, 0, key);
                        if (orderKey === 'bookmarks') app.updateBookmarkOrder(newOrder); else app.updateOrder(orderKey, newOrder);
                        app.hideModal(); app.refreshCurrentList(); app.showToast('已下移', 'success');
                    } else { app.showToast('已在最下方', 'info'); }
                });
                const pinBtn = document.getElementById('sortPin');
                if (pinBtn) pinBtn.addEventListener('click', () => { app.pinSong(orderKey, key); app.hideModal(); app.refreshCurrentList(); app.showToast('已置頂', 'success'); });
                const unpinBtn = document.getElementById('sortUnpin');
                if (unpinBtn) unpinBtn.addEventListener('click', () => { app.unpinSong(orderKey, key); app.hideModal(); app.refreshCurrentList(); app.showToast('已取消置頂', 'success'); });
            }

            refreshCurrentList() {
                if (this.currentView === 'category') this.renderSongList(this.currentCategory ? this.currentCategory.key : 'zh');
                else if (this.currentView === 'bookmark') this.renderBookmarks();
            }

            /* ============================================================
               歌詞詳情（含螢光筆）
               ============================================================ */
            showLyricsDetail(song) {
                const key = this.songKey(song);
                this.currentSongKey = key;
                this.currentSongLyrics = song.lyrics || '';
                this.selectedHlColor = 0;
                this.eraserMode = false;
                this.hasTextSelection = false;
                this.savedSelection = null;

                this.renderLyricsContent(song);
                this.renderHighlightToolbar();
                this.switchView('lyricsDetail');
            }

            renderLyricsContent(song) {
                const container = document.getElementById('lyricsDetailContent');
                if (!container) return;
                const catLabel = this.getCatLabel(song.category);
                const songHighlights = this.highlights[this.currentSongKey] || [];
                const lyricsHtml = this.renderHighlightedLyrics(this.currentSongLyrics, songHighlights);

                container.innerHTML = `
                    <div class="lyrics-meta">
                        <strong>${this.escapeHtml(song.title)}</strong>　${this.escapeHtml(song.sub || '')}　<span style="color:var(--color-text-tertiary);">${this.escapeHtml(catLabel)}${song.subcategory ? ' · ' + this.escapeHtml(song.subcategory) : ''}</span>
                    </div>
                    <div class="lyrics-content" id="lyricsContentEl">${lyricsHtml}</div>
                `;

                /* 使用事件代理處理高亮 span 的點擊（橡皮擦模式），避免 innerHTML 更新後事件丟失 */
                const lyricsEl = document.getElementById('lyricsContentEl');
                if (lyricsEl) {
                    lyricsEl.addEventListener('click', (e) => {
                        const span = e.target.closest('.lyrics-highlight');
                        if (span && app.eraserMode) {
                            e.stopPropagation();
                            const start = parseInt(span.dataset.hlStart);
                            const end = parseInt(span.dataset.hlEnd);
                            const color = parseInt(span.dataset.hlColor);
                            app.removeHighlight(app.currentSongKey, start, end, color);
                            const currentSong = app.songs.find(s => app.songKey(s) === app.currentSongKey);
                            if (currentSong) app.renderLyricsContent(currentSong);
                            app.showToast('已移除標記', 'info');
                        }
                    });
                }
            }

            /* 渲染帶螢光筆的歌詞 HTML（修正重疊處理邏輯） */
            renderHighlightedLyrics(text, highlights) {
                if (!highlights || highlights.length === 0) {
                    return this.escapeHtml(text);
                }
                /* 排序：按起始位置升序 */
                const sorted = [...highlights].sort((a, b) => a.s - b.s || a.e - b.e);
                /* 去重疊：只保留不重疊的部分 */
                const filtered = [];
                let lastEnd = -1;
                sorted.forEach(h => {
                    if (h.s >= lastEnd) {
                        /* 不重疊：直接保留 */
                        filtered.push(h);
                        lastEnd = h.e;
                    } else if (h.e > lastEnd) {
                        /* 部分重疊：只保留不重疊的尾部（從 lastEnd 到 h.e） */
                        filtered.push({ s: lastEnd, e: h.e, c: h.c });
                        lastEnd = h.e;
                    }
                    /* 完全重疊（h.e <= lastEnd）：跳過 */
                });

                let html = '';
                let pos = 0;
                filtered.forEach(h => {
                    /* 輸出高亮前的未標記文字 */
                    if (h.s > pos) {
                        html += this.escapeHtml(text.substring(pos, h.s));
                    }
                    /* 跳過起始位置在已渲染區域內的高亮（安全保護） */
                    if (h.s < pos) return;
                    /* 輸出高亮 span */
                    html += `<span class="lyrics-highlight lyrics-highlight-${h.c}" data-hl-start="${h.s}" data-hl-end="${h.e}" data-hl-color="${h.c}">${this.escapeHtml(text.substring(h.s, h.e))}</span>`;
                    pos = h.e;
                });
                /* 輸出剩餘未標記文字 */
                if (pos < text.length) {
                    html += this.escapeHtml(text.substring(pos));
                }
                return html;
            }

            /* 計算 DOM 選取在原始文字中的偏移量 */
            getTextOffset(container, node, offset) {
                const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
                let textOffset = 0;
                let current = walker.nextNode();
                while (current) {
                    if (current === node) return textOffset + offset;
                    textOffset += current.textContent.length;
                    current = walker.nextNode();
                }
                return -1;
            }

            /* 應用螢光筆標記（移除重疊後新增） */
            applyHighlight(songKey, start, end, colorIndex) {
                if (start < 0 || end <= start) return;
                if (!this.highlights[songKey]) this.highlights[songKey] = [];
                /* 移除與新標記重疊的現有標記 */
                this.highlights[songKey] = this.highlights[songKey].filter(h => !(h.s < end && h.e > start));
                this.highlights[songKey].push({ s: start, e: end, c: colorIndex });
                this.saveHighlights();
            }

            /* 移除螢光筆標記 */
            removeHighlight(songKey, start, end, color) {
                if (!this.highlights[songKey]) return;
                this.highlights[songKey] = this.highlights[songKey].filter(h => !(h.s === start && h.e === end && h.c === color));
                if (this.highlights[songKey].length === 0) delete this.highlights[songKey];
                this.saveHighlights();
            }

            /* 處理標記按鈕點擊（優先使用預存選取數據，解決行動端選取丟失問題） */
            handleHlMark() {
                let startOffset, endOffset;
                const sel = window.getSelection();
                const lyricsEl = document.getElementById('lyricsContentEl');

                /* 優先嘗試從當前選取取得偏移量 */
                if (lyricsEl && sel && !sel.isCollapsed && lyricsEl.contains(sel.anchorNode)) {
                    try {
                        const range = sel.getRangeAt(0);
                        startOffset = this.getTextOffset(lyricsEl, range.startContainer, range.startOffset);
                        endOffset = this.getTextOffset(lyricsEl, range.endContainer, range.endOffset);
                    } catch (e) {
                        console.warn('handleHlMark range error:', e);
                    }
                }

                /* 若當前選取為空，使用預存的選取數據 */
                if ((startOffset === undefined || startOffset < 0 || endOffset === undefined || endOffset <= startOffset) && this.savedSelection) {
                    startOffset = this.savedSelection.start;
                    endOffset = this.savedSelection.end;
                }

                /* 校驗偏移量有效性 */
                if (startOffset === undefined || endOffset === undefined || startOffset < 0 || endOffset <= startOffset) {
                    this.showToast('請先選取文字', 'info');
                    return;
                }

                /* 確保起止順序正確並限制在文字範圍內 */
                if (startOffset > endOffset) { [startOffset, endOffset] = [endOffset, startOffset]; }
                const textLen = this.currentSongLyrics.length;
                startOffset = Math.max(0, Math.min(startOffset, textLen));
                endOffset = Math.max(startOffset + 1, Math.min(endOffset, textLen));

                /* 應用高亮 */
                this.applyHighlight(this.currentSongKey, startOffset, endOffset, this.selectedHlColor);

                /* 清除選取和預存數據 */
                if (sel) sel.removeAllRanges();
                this.savedSelection = null;
                this.hasTextSelection = false;

                /* 重新渲染歌詞和工具欄 */
                const song = this.songs.find(s => this.songKey(s) === this.currentSongKey);
                if (song) this.renderLyricsContent(song);
                this.renderHighlightToolbar();
                this.showToast('已標記', 'success');
            }

            /* 顏色按鈕點擊：切換顏色，若有選取則直接標記 */
            handleHlColorClick(colorIndex) {
                this.selectedHlColor = colorIndex;
                this.eraserMode = false;
                this.renderHighlightToolbar();

                /* 檢查是否有當前選取或預存選取 */
                const sel = window.getSelection();
                const lyricsEl = document.getElementById('lyricsContentEl');
                let canMark = false;

                if (lyricsEl && sel && !sel.isCollapsed && lyricsEl.contains(sel.anchorNode)) {
                    canMark = true;
                }
                if (!canMark && this.savedSelection) {
                    canMark = true;
                }

                if (canMark) {
                    this.handleHlMark();
                }
            }

            /* 切換橡皮擦模式 */
            toggleEraserMode() {
                this.eraserMode = !this.eraserMode;
                this.selectedHlColor = this.eraserMode ? -1 : 0;
                this.renderHighlightToolbar();
                if (this.eraserMode) {
                    this.showToast('橡皮擦模式：點擊標記可移除', 'info');
                }
            }

            /* 更新標記按鈕狀態（同時考慮當前選取和預存選取） */
            updateHlMarkBtn() {
                const markBtn = document.getElementById('hlMarkBtn');
                if (markBtn) {
                    const shouldShow = (this.hasTextSelection || this.savedSelection) && !this.eraserMode;
                    markBtn.classList.toggle('visible', shouldShow);
                }
            }

            /* ============================================================
               渲染：螢光筆工具欄
               ============================================================ */
            renderHighlightToolbar() {
                const row = document.getElementById('hlToolbarRow');
                const legend = document.getElementById('hlLegend');
                if (!row || !legend) return;

                /* 工具列：顏色按鈕 + 分隔線 + 橡皮擦 + 模式提示 + 標記按鈕 */
                let rowHtml = '';
                HIGHLIGHT_COLORS.forEach((c, i) => {
                    const active = (!this.eraserMode && this.selectedHlColor === i) ? ' active' : '';
                    rowHtml += `<button class="hl-color-btn${active}" data-hl-color="${i}" style="background:${c.dot};" title="${this.escapeHtml(this.colorMeanings[i])}"></button>`;
                });
                rowHtml += '<div class="hl-sep"></div>';
                rowHtml += `<button class="hl-eraser-btn${this.eraserMode ? ' active' : ''}" id="hlEraserBtn" title="橡皮擦">🧹</button>`;
                /* 模式提示文字 */
                if (this.eraserMode) {
                    rowHtml += '<span class="hl-mode-label eraser">橡皮擦</span>';
                } else {
                    const curColorName = HIGHLIGHT_COLORS[this.selectedHlColor] ? HIGHLIGHT_COLORS[this.selectedHlColor].name : '';
                    const curMeaning = this.colorMeanings[this.selectedHlColor] || '';
                    rowHtml += `<span class="hl-mode-label">${this.escapeHtml(curColorName)}：${this.escapeHtml(curMeaning)}</span>`;
                }
                rowHtml += `<button class="hl-mark-btn${(this.hasTextSelection || this.savedSelection) && !this.eraserMode ? ' visible' : ''}" id="hlMarkBtn">標記</button>`;
                row.innerHTML = rowHtml;

                /* 顏色圖例 */
                let legendHtml = '';
                HIGHLIGHT_COLORS.forEach((c, i) => {
                    legendHtml += `<div class="hl-legend-item" data-hl-meaning="${i}">`;
                    legendHtml += `<span class="hl-legend-dot" style="background:${c.dot};"></span>`;
                    legendHtml += `<span class="hl-legend-text">${this.escapeHtml(this.colorMeanings[i])}</span>`;
                    legendHtml += '</div>';
                });
                legend.innerHTML = legendHtml;

                /* 綁定事件 */
                row.querySelectorAll('[data-hl-color]').forEach(btn => {
                    btn.addEventListener('click', () => { app.handleHlColorClick(parseInt(btn.dataset.hlColor)); });
                });
                const eraserBtn = document.getElementById('hlEraserBtn');
                if (eraserBtn) eraserBtn.addEventListener('click', () => { app.toggleEraserMode(); });
                const markBtn = document.getElementById('hlMarkBtn');
                if (markBtn) markBtn.addEventListener('click', () => { app.handleHlMark(); });
                legend.querySelectorAll('[data-hl-meaning]').forEach(item => {
                    item.addEventListener('click', () => { app.showColorMeaningModal(parseInt(item.dataset.hlMeaning)); });
                });
            }

            /* ============================================================
               顏色含義編輯 Modal
               ============================================================ */
            showColorMeaningModal(colorIndex) {
                const color = HIGHLIGHT_COLORS[colorIndex];
                const currentMeaning = this.colorMeanings[colorIndex] || '';
                const bodyHtml = `
                    <div class="form-group">
                        <label class="form-label">
                            <span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${color.dot};vertical-align:middle;margin-right:6px;"></span>
                            ${this.escapeHtml(color.name)}的含義
                        </label>
                        <input class="form-input" id="colorMeaningInput" type="text" placeholder="輸入此顏色代表的含義" value="${this.escapeHtml(currentMeaning)}" maxlength="20" />
                    </div>`;
                const footerHtml = `<button class="modal-btn cancel" id="modalCancelBtn">取消</button><button class="modal-btn confirm" id="modalConfirmBtn">確認</button>`;
                this.showModal('編輯顏色含義', bodyHtml, footerHtml);
                document.getElementById('modalCancelBtn').addEventListener('click', () => app.hideModal());
                document.getElementById('modalConfirmBtn').addEventListener('click', () => {
                    const meaning = document.getElementById('colorMeaningInput').value.trim();
                    app.colorMeanings[colorIndex] = meaning || DEFAULT_COLOR_MEANINGS[colorIndex];
                    app.saveColorMeanings();
                    app.hideModal();
                    app.renderHighlightToolbar();
                    app.showToast('含義已更新', 'success');
                });
                setTimeout(() => { const input = document.getElementById('colorMeaningInput'); if (input) input.focus(); }, 300);
            }

            getCatLabel(catKey) {
                const cat = this.categories.find(c => c.key === catKey);
                return cat ? cat.label : catKey;
            }

            /* ============================================================
               書籤操作
               ============================================================ */
            toggleBookmark(id) {
                const idx = this.bookmarks.indexOf(id);
                if (idx >= 0) {
                    this.bookmarks.splice(idx, 1);
                    this.showToast('已移除書籤', 'info');
                } else {
                    this.bookmarks.push(id);
                    this.showToast('已加入書籤', 'success');
                }
                this.saveBookmarks();
            }

            /* ============================================================
               渲染：自訂頁
               ============================================================ */
            renderCustom() {
                const container = document.getElementById('customContent');
                if (!container) return;
                let html = '';
                html += '<div class="custom-tab-bar"><div class="custom-tab-scroll">';
                this.categories.forEach(c => {
                    const active = (this.customSelectedCat === c.key) ? ' active' : '';
                    html += `<button class="custom-tab-item${active}" data-select-cat="${this.escapeHtml(c.key)}">${this.escapeHtml(c.label)}</button>`;
                });
                html += '<button class="custom-tab-item add-tab" id="addCatTabBtn">＋</button>';
                html += '</div></div>';

                if (this.customSelectedCat) {
                    const cat = this.categories.find(c => c.key === this.customSelectedCat);
                    if (cat) {
                        const songCount = this.songs.filter(s => s.category === cat.key).length;
                        html += '<div class="custom-cat-header">';
                        html += `<span class="custom-cat-header-name">${this.escapeHtml(cat.label)} <span class="custom-item-sub">(${songCount} 首歌曲)</span></span>`;
                        html += `<button class="custom-action-btn text-btn edit" data-edit-cat="${this.escapeHtml(cat.key)}">✎ 編輯</button>`;
                        html += `<button class="custom-action-btn text-btn delete" data-del-cat="${this.escapeHtml(cat.key)}">✕ 刪除</button>`;
                        html += '</div>';

                        const subcats = cat.subcategories || [];
                        html += '<div class="custom-section">';
                        html += '<div class="custom-section-header">';
                        html += `<div class="custom-section-left" id="toggleSubcatSection"><span class="custom-section-title">子分類</span><span class="custom-section-count">(${subcats.length})</span><span class="custom-section-toggle">${this.customSubcatExpanded ? '▾ 閉合' : '▸ 展開'}</span></div>`;
                        html += '<div class="custom-section-actions"><button class="custom-add-btn" id="addSubcatBtn">＋ 新增</button></div></div>';
                        html += `<div class="custom-section-content${this.customSubcatExpanded ? '' : ' collapsed'}" id="subcatContent">`;
                        if (!subcats.length) { html += '<div class="list-empty" style="padding:16px;">尚無子分類</div>'; }
                        else { subcats.forEach(sc => { const scCount = this.songs.filter(s => s.category === cat.key && s.subcategory === sc).length; html += `<div class="custom-subcat-item"><span class="custom-item-name">${this.escapeHtml(sc)} <span class="custom-item-sub">(${scCount} 首)</span></span><button class="custom-action-btn delete" data-del-subcat="${this.escapeHtml(sc)}" data-subcat-cat="${this.escapeHtml(cat.key)}">✕</button></div>`; }); }
                        html += '</div></div>';

                        const songsInCat = this.songs.filter(s => s.category === cat.key);
                        html += '<div class="custom-section">';
                        html += '<div class="custom-section-header">';
                        html += `<div class="custom-section-left" id="toggleSongsSection"><span class="custom-section-title">歌曲</span><span class="custom-section-count">(${songsInCat.length})</span><span class="custom-section-toggle">${this.customSongsExpanded ? '▾ 閉合' : '▸ 展開'}</span></div>`;
                        html += '<div class="custom-section-actions"><button class="custom-add-btn" id="addSongBtn">＋ 新增</button></div></div>';
                        html += `<div class="custom-section-content${this.customSongsExpanded ? '' : ' collapsed'}" id="songsContent">`;
                        if (!songsInCat.length) { html += '<div class="list-empty" style="padding:16px;">此分類下沒有歌曲</div>'; }
                        else { songsInCat.forEach(s => { const key = this.songKey(s); html += `<div class="custom-item"><span class="custom-item-name">${this.escapeHtml(s.title)} <span class="custom-item-sub">${this.escapeHtml(s.sub || '')}</span></span><button class="custom-action-btn edit" data-edit-song="${this.escapeHtml(key)}">✎</button><button class="custom-action-btn delete" data-del-song="${this.escapeHtml(key)}">✕</button></div>`; }); }
                        html += '</div></div>';
                    }
                } else {
                    html += '<div class="list-empty" style="padding:40px 24px;">請選擇一個分類<br>或點擊「＋」新增分類</div>';
                }
                container.innerHTML = html;

                const subcatContent = document.getElementById('subcatContent');
                if (subcatContent && this.customSubcatExpanded) subcatContent.style.maxHeight = subcatContent.scrollHeight + 'px';
                const songsContent = document.getElementById('songsContent');
                if (songsContent && this.customSongsExpanded) songsContent.style.maxHeight = songsContent.scrollHeight + 'px';

                container.querySelectorAll('[data-select-cat]').forEach(btn => { btn.addEventListener('click', function() { app.customSelectedCat = this.dataset.selectCat; app.customSubcatExpanded = false; app.customSongsExpanded = false; app.renderCustom(); }); });
                const addCatTabBtn = document.getElementById('addCatTabBtn');
                if (addCatTabBtn) addCatTabBtn.addEventListener('click', () => app.showCategoryModal());
                container.querySelectorAll('[data-edit-cat]').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); const key = btn.dataset.editCat; const cat = app.categories.find(c => c.key === key); if (cat) app.showCategoryModal(cat); }); });
                container.querySelectorAll('[data-del-cat]').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); const key = btn.dataset.delCat; const cat = app.categories.find(c => c.key === key); if (cat) app.confirmDeleteCategory(cat); }); });
                const toggleSubcatSection = document.getElementById('toggleSubcatSection');
                if (toggleSubcatSection) toggleSubcatSection.addEventListener('click', () => { app.customSubcatExpanded = !app.customSubcatExpanded; app.renderCustom(); });
                const addSubcatBtn = document.getElementById('addSubcatBtn');
                if (addSubcatBtn) addSubcatBtn.addEventListener('click', () => app.showSubcategoryModal());
                container.querySelectorAll('[data-del-subcat]').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); app.confirmDeleteSubcategory(btn.dataset.delSubcat, btn.dataset.subcatCat); }); });
                const toggleSongsSection = document.getElementById('toggleSongsSection');
                if (toggleSongsSection) toggleSongsSection.addEventListener('click', () => { app.customSongsExpanded = !app.customSongsExpanded; app.renderCustom(); });
                const addSongBtn = document.getElementById('addSongBtn');
                if (addSongBtn) addSongBtn.addEventListener('click', () => app.showSongModal());
                container.querySelectorAll('[data-edit-song]').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); const key = btn.dataset.editSong; const song = app.songs.find(s => app.songKey(s) === key); if (song) app.showSongModal(song); }); });
                container.querySelectorAll('[data-del-song]').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); const key = btn.dataset.delSong; const song = app.songs.find(s => app.songKey(s) === key); if (song) app.confirmDeleteSong(song); }); });
            }

            showCategoryModal(existingCat) {
                const isEdit = !!existingCat;
                const title = isEdit ? '編輯分類' : '新增分類';
                const nameVal = isEdit ? this.escapeHtml(existingCat.label) : '';
                const bodyHtml = `<div class="form-group"><label class="form-label">分類名稱</label><input class="form-input" id="catNameInput" type="text" placeholder="請輸入分類名稱" value="${nameVal}" maxlength="20" /></div>`;
                const footerHtml = `<button class="modal-btn cancel" id="modalCancelBtn">取消</button><button class="modal-btn confirm" id="modalConfirmBtn">確認</button>`;
                this.showModal(title, bodyHtml, footerHtml);
                document.getElementById('modalCancelBtn').addEventListener('click', () => app.hideModal());
                document.getElementById('modalConfirmBtn').addEventListener('click', () => {
                    const name = document.getElementById('catNameInput').value.trim();
                    if (!name) { app.showToast('請輸入分類名稱', 'error'); return; }
                    const duplicate = app.categories.find(c => c.label === name && (!isEdit || c.key !== existingCat.key));
                    if (duplicate) { app.showToast('此分類名稱已存在', 'error'); return; }
                    if (isEdit) { existingCat.label = name; app.saveCategories(); app.showToast('分類已更新', 'success'); }
                    else { const newCat = { key: app.generateCatKey(), label: name, subcategories: [] }; app.categories.push(newCat); app.customSelectedCat = newCat.key; app.saveCategories(); app.showToast('分類已新增', 'success'); }
                    app.hideModal(); app.renderCustom();
                });
                setTimeout(() => { const input = document.getElementById('catNameInput'); if (input) input.focus(); }, 300);
            }

            confirmDeleteCategory(cat) {
                const count = this.songs.filter(s => s.category === cat.key).length;
                let msg = `確定要刪除分類「<strong>${this.escapeHtml(cat.label)}</strong>」嗎？`;
                if (count > 0) msg += `<br>該分類下的 ${count} 首歌曲也將一併刪除。`;
                const bodyHtml = `<div class="confirm-text">${msg}</div>`;
                const footerHtml = `<button class="modal-btn cancel" id="modalCancelBtn">取消</button><button class="modal-btn danger" id="modalConfirmBtn">刪除</button>`;
                this.showModal('確認刪除', bodyHtml, footerHtml);
                document.getElementById('modalCancelBtn').addEventListener('click', () => app.hideModal());
                document.getElementById('modalConfirmBtn').addEventListener('click', () => {
                    const catSongs = app.songs.filter(s => s.category === cat.key);
                    catSongs.forEach(s => { const key = app.songKey(s); app.bookmarks = app.bookmarks.filter(b => b !== key); app.cleanupOrderData(key); });
                    app.cleanupCategoryOrderData(cat.key);
                    app.songs = app.songs.filter(s => s.category !== cat.key);
                    app.categories = app.categories.filter(c => c.key !== cat.key);
                    if (app.customSelectedCat === cat.key) app.customSelectedCat = '';
                    app.saveCategories(); app.saveSongs(); app.saveBookmarks();
                    app.hideModal(); app.showToast('分類已刪除', 'success'); app.renderCustom();
                });
            }

            showSubcategoryModal() {

                document.getElementById('modalConfirmBtn').addEventListener('click', () => {
                    const name = document.getElementById('subcatNameInput').value.trim();
                    if (!name) { app.showToast('請輸入子分類名稱', 'error'); return; }

            showSongModal(existingSong) {
